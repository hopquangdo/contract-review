x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  neo4j:
    image: neo4j:latest
    container_name: graphrag-neo4j
    restart: unless-stopped
    ports:
      - "7475:7474" # HTTP - Neo4j Browser: http://localhost:7475
      - "7688:7687" # Bolt - dùng trong NEO4J_URI
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-testpassword123}
      NEO4J_PLUGINS: '["genai","apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      neo4j:
        condition: service_healthy
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: graphrag-frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    depends_on:
      - api
    logging: *default-logging

volumes:
  neo4j_data:
  neo4j_logs:
