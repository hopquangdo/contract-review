 với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "12.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7678, "content": "12.2. Một trong Hai Bên có quyền chấm dứt Hợp đồng nếu Bên kia có hành vi vi phạm cơ bản nghĩa vụ hợp đồng, bao gồm nhưng không giới hạn ở:\n\na) Không thực hiện nghĩa vụ thanh toán trong thời hạn quá 30 ngày kể từ ngày đến hạn mà không có lý do chính đáng hoặc không được khắc phục sau khi nhận được thông báo bằng văn bản từ Bên còn lại;\n\nb) Từ chối bàn giao hoặc từ chối thực hiện Hợp đồng hoặc đơn phương đình chỉ công việc trái Hợp đồng;\n\nc) Một Bên vi phạm cam đoan và bảo đảm theo quy định tại khoản 10.1 Điều 11 Hợp đồng này.\n\nd) VTIT có quyền chấm dứt Hợp đồng nếu Khách hàng mất khả năng thanh toán hoặc có căn cứ hợp lý để xác định Khách hàng không còn khả năng thanh toán các khoản đến hạn theo Hợp đồng.\n\ne) Vi phạm nghiêm trọng nghĩa vụ Hợp đồng.\n\nTrong các trường hợp này, Bên bị vi phạm phải được thông báo bằng văn bản và có ít nhất 15 ngày làm việc để khắc phục trước khi Bên kia chính thức chấm dứt Hợp đồng."}, "chain": [{"number": "10.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "10.1. Các Bên cam đoan và bảo đảm rằng:\n\na) Có đầy đủ năng lực pháp lý, tư cách pháp nhân và quyền ký kết và thực hiện Hợp đồng này theo quy định của pháp luật;\n\nb) Phần mềm, hệ thống là phù hợp với quy định của pháp luật hiện hành, không vi phạm bất kỳ quy định cấm nào, không bị cấm phát triển hoặc sử dụng theo pháp luật Việt Nam hoặc điều ước quốc tế có hiệu lực; việc xây dựng Phần mềm, hệ thống không làm phát sinh trách nhiệm pháp lý cho VTIT với tư cách là bên cung cấp dịch vụ.\n\nc) Phần mềm/hệ thống và/hoặc Dịch vụ theo Hợp đồng không được sử dụng, trực tiếp hoặc gián tiếp, cho bất kỳ mục đích nào liên quan đến khủng bố,\n\ntài trợ khủng bố, tội phạm xuyên quốc gia/tội phạm quốc tế, rửa tiền, buôn bán người, hoặc các hành vi bị cấm theo pháp luật Việt Nam và/hoặc các điều ước quốc tế có hiệu lực; Khách hàng cam kết bảo đảm việc sử dụng là hợp pháp và bồi thường, giữ cho VTIT không bị thiệt hại trước mọi khiếu nại, yêu cầu, chế tài phát sinh từ việc Khách hàng vi phạm cam kết này.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.762, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) tance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}, {"root": {"number": "18.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7671, "content": "18.4. Khi phương án xử lý được Khách hàng chấp thuận, VTIT sẽ triển khai việc khắc phục trong thời hạn tối đa [12] giờ làm việc đối với lỗi mức độ nghiêm trọng hoặc theo thời gian thống nhất giữa hai Bên nếu lỗi có tính chất phức tạp hoặc phụ thuộc yếu tố hạ tầng/vận hành của Khách hàng."}, "chain": []}, {"root": {"number": "11.2", "title": "", "is_appendix": false, "matched": true, "score": 0.767, "content": "11.2. Phạt vi phạm: - a) Trường hợp tiến độ thực hiện và bàn giao kết quả công việc bị chậm trễ so với kế hoạch tháng, và nguyên nhân được xác định là do lỗi của VTIT sau khi đã có đầy đủ thông tin, tài liệu từ Khách hàng, thì VTIT sẽ phải chịu phạt vi phạm 0,05% giá trị phần công việc bị chậm, tổng mức phạt vi phạm không quá 8% giá trị phần nghĩa vụ/công việc bị vi phạm (bị chậm). Trước khi áp dụng phạt, Khách hàng có trách nhiệm thông báo bằng văn bản và cho VTIT thời gian khắc phục hợp lý (tối thiểu 05 ngày làm việc).\n\nb) Nếu kết quả công việc VTIT bàn giao không đạt yêu cầu theo Hợp đồng và Phiếu yêu cầu, và VTIT không khắc phục trong thời hạn hợp lý được Khách hàng thông báo bằng văn bản, thì VTIT phải chịu phạt 0,05 giá trị phần công việc không đạt yêu cầu, tổng mức phạt vi phạm không quá 8% giá trị phần công việc bị vi phạm.\n\nc) Nếu một bên tự ý chấm dứt Hợp đồng mà không có sự thoả thuận trước bằng văn bản với bên kia hoặc không nằm trong các trường hợp được quyền đơn phương chấm dứt theo quy định tại Hợp đồng, quy định pháp\n\nluật thì phải chịu phạt 8% giá trị bị vi phạm. Trong trường hợp này, các Bên xác định giá trị bị vi phạm là giá trị Hợp đồng chưa thực hiện.\n\nd) Nếu Khách hàng không thực hiện hoặc thực hiện không đầy đủ nghĩa vụ thanh toán theo quy định tại Hợp đồng thì Khách hàng phải chịu phạt 0,1% giá trị thanh toán bị chậm cho mỗi ngày chậm thanh toán nhưng tổng số tiền phạt vi phạm không vượt quá 8% giá trị thanh toán bị chậm."}, "chain": []}, {"root": {"number": "14.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7667, "content": "14.2. Chỉ tiêu kỹ thuật và tiêu chí nghiệm thu\n\nCác chỉ tiêu kỹ thuật, yêu cầu chức năng/phi chức năng, cấu hình môi trường, tiêu chuẩn chất lượng, tiêu chí nghiệm thu và phương pháp kiểm thử (nếu có) của Sản phẩm/Dịch vụ sẽ được dẫn chiếu và quy định chi tiết tại Phụ lục 01. Trường hợp có khác biệt giữa Hợp đồng và Phụ lục 02 về nội dung kỹ thuật, Phụ lục 02 được ưu tiên áp dụng đối với phần kỹ thuật."}, "chain": []}, {"root": {"number": "15.1", "title": "", "is_appendix": false, "matched": true, "score": 0.766, "content": "15.1. Giá trị hợp đồng:\n\na) Tổng giá trị hợp đồng dự kiến: 10.000.000.0000 VNĐ\n\n(Bằng chữ: Mười tỷ đồng\n\n./.)\n\nChi tiết giá Dịch vụ cụ thể như sau: |   STT | Dịch vụ               |   Khối lượng (MM) | Đơn giá (VNĐ)   | Thành tiền (VNĐ)   |\n\n|-------|-----------------------|-------------------|-----------------|--------------------|\n\n|     1 | Phát triển phần mềm A |               700 | 10.000.000      | 7.000.000.000      |\n\n|     2 | Phát triển phần mềm B |               300 | 10.000.000      | 3.000.000.000      |\n\n|       | Thuế GTGT             |                 0 | 0               | 0                  |\n\n|       | Tổng cộng             |              1000 |                 | 10.000.000.000     |\n\nb) Dịch vụ phát triển phần mềm là đối tượng không chịu thuế GTGT theo quy định pháp luật hiện hành tại thời điểm ký kết Hợp đồng. Trường hợp có phát sinh nghĩa vụ nộp thuế GTGT đối với Dịch vụ thì Khách hàng có trách nhiệm thanh toán phần thuế GTGT phát sinh bổ sung này cho VTIT hoặc nộp trực tiếp cho cơ quan nhà nước có thẩm quyền, trong thời hạn được ghi nhận tại thông báo của VTIT hoặc cơ quan nhà nước.\n\nc) Khách hàng thanh toán giá trị nghiệm thu thực tế cho VTIT."}, "chain": []}, {"root": {"number": "15.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7643, "content": "15.3. Thời hạn và hồ sơ thanh toán:\n\na) Tạm ứng: Khách hàng sẽ tạm ứng cho VTIT một khoản tiền tương ứng với 30% (ba mươi phần trăm) giá trị Hợp đồng trong vòng 05 (năm) ngày làm việc kể từ ngày Khách hàng nhận được đầy đủ hồ sơ tạm ứng do VTIT cung cấp, bao gồm:\n\n- (i) Hợp đồng đã được hai Bên ký kết; và\n\n- (ii) Đề nghị tạm ứng.\n\nb) Nguyên tắc khấu trừ tạm ứng: Khoản tạm ứng quy định tại điểm a) nêu trên sẽ được khấu trừ dần vào các khoản thanh toán tại các đợt thanh toán lần 1 và lần 2 theo tỷ lệ tương ứng với giá trị mỗi đợt thanh toán.\n\nc) Thanh toán lần 1 - Sau khi ký Biên bản bàn giao phần mềm (HOC)::\n\nKhách hàng sẽ thanh toán cho VTIT khoản tiền tương ứng với 65% ( Sáu mươi lăm phần trăm ) giá trị Hợp đồng sau khi khấu trừ phần tạm ứng tương ứng theo điểm b) trong vòng 05 (năm) ngày làm việc kể từ ngày Khách hàng nhận được đầy đủ hồ sơ thanh toán hợp lệ bao gồm:\n\n- (i) Biên bản bàn giao phần mềm (HOC); và\n\n- (ii) Đề nghị thanh toán.\n\nd) Thanh toán lần 2 - Sau khi ký Biên bản nghiệm thu tổng thể (FAC):\n\nKhách hàng sẽ thanh toán cho VTIT toàn bộ khoản tiền còn lại tương ứng với 5% (Năm phần trăm) giá trị Hợp đồng, sau khi khấu trừ toàn bộ phần tạm ứng chưa được khấu trừ (nếu có), trong vòng 05 (năm) ngày làm việc kể từ ngày Khách hàng nhận được đầy đủ hồ sơ thanh toán hợp lệ bao gồm:\n\n- (i) Biên bản nghiệm thu tổng thể (FAC);\n\n- (ii) Đề nghị thanh toán;\n\n- (iii) Hóa đơn giá trị gia tăng hợp lệ tương ứng."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.762, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.762, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm p ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "5.5", "title": "", "is_appendix": false, "matched": true, "score": 0.7551, "content": "5.5. Quyền sở hữu trí tuệ của các Bên đối với Phần mềm được xác định như sau:\n\n## Mô hình 1: Client-owned IP (KH sở hữu sản phẩm bàn giao)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ (bao gồm quyền tác giả đối với chương trình máy tính, quyền liên quan và các quyền tài sản khác theo pháp luật) đối với các hạng mục  bàn giao/deliverables được tạo ra riêng cho Khách hàng trong quá trình thực hiện Dịch vụ ('Sản phẩm bàn giao') sẽ thuộc về Khách hàng.\n\n- b. Kể từ thời điểm nêu trên, VTIT chuyển giao cho Khách hàng các quyền tài sản tương ứng đối với Sản phẩm bàn giao trong phạm vi pháp luật cho phép; Khách hàng có quyền sử dụng, khai thác, sửa đổi, sao chép, phát triển theo mục đích quy định tại Hợp đồng này.\n\n- c. VTIT cam kết không tái sử dụng Sản phẩm bàn giao (toàn bộ hoặc phần cốt lõi mang tính đặc thù của Khách hàng) cho khách hàng khác, trừ (i) phần thuộc Tài sản có sẵn/Background IP của VTIT; và/hoặc (ii) các thành phần mã nguồn mở/được cấp phép hợp pháp.\n\n## Mô hình 2: Vendor-owned IP (VTIT sở hữu bản quyền)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ đối với Sản phẩm bàn giao (bao gồm mọi cải tiến/phát triển phát sinh trong quá trình thực hiện Dịch vụ) sẽ thuộc về VTIT.\n\n- b. VTIT cấp cho Khách hàng một giấy phép sử dụng Sản phẩm bàn giao trọn đời, không độc quyền, không chuyển nhượng, không được cấp lại nếu không có chấp thuận bằng văn bản của VTIT, trong phạm vi mục đích sử dụng theo Hợp đồng/Phụ lục.\n\n- c. Khách hàng không được (và không được cho  phép bên khác) thực hiện reverse  engineering  (phân  tích  ngược/dịch  ngược),  decompile  (giải  biên dịch), disassemble (tháo rời/dịch ngược sang mã máy/assembly), tách/chiết mã nguồn, hoặc tạo sản phẩm phái sinh nhằm thương mại hóa/phân phối lại Sản phẩm bàn giao, trừ khi pháp luật bắt buộc. VTIT được quyền tái sử dụng,  cung  cấp  cho  khách  hàng  khác  các  thành  phần  chung/khung  kỹ thuật/know-how, với điều kiện không tiết lộ Thông tin mật của Khách hàng.\n\n## Mô hình 3 - Pre-existing IP (Background IP gixisting IP tạo sản phẩm phái sinh\n\n- a. 'Background IP' là toàn bộ mã nguồn, công cụ, thư viện, framework, tài liệu, quy trình, bí quyết kỹ thuật, nền tảng phần mềm và/hoặc các thành phần khác mà VTIT (hoặc bên cấp phép hợp pháp cho VTIT) đã sở hữu/có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập, không phụ thuộc vào dự án. Background IP thuộc sở hữu của VTIT (hoặc chủ thể có quyền), và không chuyển giao cho Khách hàng theo Hợp đồng này.\n\n- b. 'Project IP' là các hạng mục được phát triển riêng theo yêu cầu của Khách hàng  trong  phạm  vi  Dịch  vụ  (ví  dụ:  chức  năng,  luồng  nghiệp  vụ,  cấu hình/tùy  biến,  tài  liệu  đặc  thù,  mã  nguồn  custom  nếu  có).  Trừ  khi  Hợp đồng/Phụ lục quy định khác, Project IP sẽ thuộc về Khách hàng.\n\n- c. Trong phạm vi cần thiết để Khách hàng khai thác Project IP/Sản phẩm bàn giao, VTIT cấp cho Khách hàng giấy phép sử dụng Background IP trọn đời, không độc quyền, không chuyển nhượng, chỉ để vận hành/khai thác Sản phẩm bàn giao theo Hợp đồng.\n\n## Mô hình 4 - Đồng sở hữu; cả hai Bên được khai thác thương mại; VTIT độc quyền quyền đăng ký/đứng tên\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, các hạng mục/deliverables được tạo ra trong quá trình thực hiện Dịch vụ theo Hợp đồng ('Sản phẩm') là tài sản đồng sở hữu của VTIT và Khách hàng đối với phần quyền tài sản theo pháp luật về sở hữu trí tuệ, kể từ thời điểm Khách hàng hoàn tất thanh toán đầy đủ mọi khoản đến hạn theo Hợp đồng.\n\n- b. Quyền khai thác của các Bên: Mỗi Bên có quyền độc lập khai thác thương mại Sản phẩm (bao gồm phát triển, nâng cấp, phân phối, chuyển giao/cấp phép quyền sử dụng, cung cấp dưới dạng dịch vụ, cho thuê hoặc hình thức thương mại hợp pháp khác) cho bên thứ ba mà không phải xin chấp thuận của Bên còn lại, với điều kiện: (i) không tiết lộ Thông tin mật của Bên còn lại; (ii) không sử dụng dữ liệu, nhãn hiệu, tên thương mại, dấu hiệu nhận diện và/hoặc các tài sản riêng của Bên còn lại nếu không có chấp thuận bằng  văn  bản;  và  (iii)  tuân  thủ  các  nghĩa  vụ/bảo  lưu  quyền  đối  với Background IP và/hoặc mã nguồn mở (OSS) (nếu có).\n\n- c. Quyền đăng ký và đứng tên: VTIT là bên duy nhất có quyền nộp đơn, thực hiện thủ tục đăng ký (và đứng tên trên Giấy chứng nhận, nếu được cấp) đối với quyền tác giả/chương trình máy tính và/hoặc quyền sở hữu trí tuệ liên quan đến Sản phẩm. Việc VTIT đứng tên đăng ký không làm thay đổi bản chất đồng sở hữu và quyền khai thác của Khách hàng theo khoản 1 và khoản 2 Điều này.\n\n- d. Bảo lưu Background IP và OSS: Mọi tài sản có sẵn/Background IP của mỗi Bên và/hoặc các thành phần mã nguồn mở (OSS) được sử dụng trong Sản phẩm (nếu có) vẫn thuộc chủ sở hữu tương ứng và/hoặc tuân theo điều kiện giấy phép áp dụng; điều khoản đồng sở hữu tại Điều này không được hiểu là chuyển giao quyền sở hữu đối với Background IP/OSS.\n\nCác Bên lựa chọn Mô hình 1 để điều chỉnh quyền sở hữu trí tuệ trong Hợp đồng này."}, "chain": [{"number": "5.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.2. Sau khi VTIT hoàn thành việc bàn giao kết quả công việc cho Khách hàng và Khách hàng đã thanh toán đầy đủ cho VTIT theo quy định tại Hợp đồng, Khách hàng sẽ nhận được đầy đủ quyền sở hữu trí tuệ theo quy định tại khoản 5.6 Điều này.", "relation": "REFERS_TO", "children": [{"number": "5.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.1. VTIT cam kết không vi phạm bất kỳ quyền sở hữu trí tuệ nào của bên thứ ba hoặc sử dụng tài sản trí tuệ chưa được cấp phép hợp pháp trong quá trình cung cấp dịch vụ theo Hợp đồng này. Trường hợp có tranh chấp phát sinh liên quan đến quyền sở hữu trí tuệ do lỗi của VTIT, VTIT sẽ chịu trách nhiệm giải quyết các tranh chấp phát sinh (nếu có). Tuy nhiên, VTIT không chịu trách nhiệm đối với các nội dung, tài liệu, dữ liệu hoặc yêu cầu do Khách hàng cung cấp gây ra vi phạm.", "relation": "REFERS_TO", "children": []}]}, {"number": "5.3", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.3. VTIT có quyền sử dụng lại các thành phần, công cụ, thư viện, đoạn mã được phát triển sẵn hoặc không mang tính đặc thù cho Khách hàng trong các dự án\n\nkhác, với điều kiện không tiết lộ thông tin bảo mật hoặc vi phạm quyền sở hữu trí tuệ của Khách hàng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.762, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"number": "5.4", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.4. Trong quá trình cung cấp Dịch vụ và/hoặc phát triển Sản phẩm bàn giao, VTIT có thể sử dụng một số thành phần phần mềm mã nguồn mở (Open Source Software - OSS) được cấp phép hợp pháp theo các giấy phép mã nguồn mở tương ứng. Việc sử dụng các thành phần OSS này phải tuân thủ đầy đủ các điều kiện của giấy phép OSS áp dụng. Các thành phần OSS (nếu có) không thuộc quyền sở hữu của VTIT và không được chuyển giao quyền sở hữu theo Hợp đồng này; việc sử dụng, khai thác và phân phối các thành phần OSS sẽ tuân theo các điều kiện cấp phép của chủ sở hữu OSS tương ứng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "17.9", "title": "", "is_appendix": false, "matched": true, "score": 0.7546, "content": "17.9. Trong trường hợp việc kiểm thử hoặc nghiệm thu phải thực hiện lại nhiều lần không do lỗi của VTIT (bao gồm các trường hợp Khách hàng thay đổi yêu cầu ngoài phạm vi hợp đồng, dữ liệu kiểm thử sai, lỗi hạ tầng, thiếu đầu mối phối hợp…), VTIT có quyền đề xuất chi phí phát sinh hợp lý cho các lần kiểm thử lại này, trên cơ sở tài liệu chứng minh và sự xác nhận của Khách hàng."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.762, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "18.6", "title": "", "is_appendix": false, "matched": true, "score": 0.7509, "content": "18.6. VTIT sẽ thực hiện bảo hành chủ yếu thông qua hỗ trợ từ xa (remote). Trường hợp việc khắc phục lỗi không thể thực hiện từ xa hoặc theo yêu cầu hợp lý của Khách  hàng,  VTIT  sẽ  thực  hiện  bảo  hành  tại  địa  điểm  triển  khai  hệ  thống (onsite). Các chi phí hợp lý phát sinh cho việc hỗ trợ onsite (nếu có) sẽ do Khách hàng thanh toán, trừ trường hợp lỗi được xác định hoàn toàn do VTIT gây ra.\n\n## PHẦN III. ĐIỀU KHOẢN CUỐI"}, "chain": []}, {"root": {"number": "18.5", "title": "", "is_appendix": false, "matched": true, "score": 0.7387, "content": "18.5. VTIT không chịu trách nhiệm bảo hành hoặc khắc phục lỗi đối với các sự cố phát sinh sau nghiệm thu do thay đổi hệ thống, can thiệp kỹ thuật, cấu hình hoặc sử dụng sai hướng dẫn từ phía Khách hàng hoặc bên thứ ba khác không phải do\n\n- VTIT triển khai. Việc khắc phục trong các trường hợp này (nếu có) sẽ được tính là dịch vụ phát sinh và thanh toán riêng theo thỏa thuận."}, "chain": []}]}, {"item_id": "CL-16", "category": "Tiến độ dự án", "question": "Tiến độ dự án, milestone và thời gian phản hồi/yêu cầu hỗ trợ có khả thi không?", "status": "fail", "evidence": "Điều 8.1, 8.2 (định nghĩa bất khả kháng; thủ tục thông báo); Điều 17.8 (gia hạn thời hạn khi chậm do Khách hàng không cung cấp/ phản hồi kịp thời); Điều 16.4 (quy định quyền đề nghị điều chỉnh thời gian khi Khách hàng chậm cung cấp thông tin, tài liệu, chậm phản hồi, chậm phê duyệt hoặc thay đổi yêu cầu; không bị coi là vi phạm/không chịu chế tài); Điều 16.2 (việc thay đổi thời gian cung cấp dịch vụ phải được chấp thuận và có Phụ lục điều chỉnh).", "reasoning": "Hợp đồng không cung cấp bằng chứng về milestone/mốc tiến độ gắn ngày cụ thể hoặc điều kiện rõ ràng trong phần điều khoản được truy hồi. Đồng thời, dù có điều khoản điều chỉnh/gia hạn khi Khách hàng chậm cung cấp thông tin/phản hồi/phê duyệt và có định nghĩa bất khả kháng, nhưng thủ tục thông báo bất khả kháng lại đặt thời hạn 03 ngày làm việc, không phù hợp tiêu chí 7–15 ngày nên thuộc tiêu chí vi phạm.", "recommendation": "Đề nghị bổ sung/đối chiếu trong Phụ lục 01/biểu tiến độ các milestone gắn ngày cụ thể hoặc mốc theo điều kiện rõ ràng. Về bất khả kháng, đề nghị chỉnh thời hạn thông báo từ “03 ngày làm việc” sang trong khoảng “7–15 ngày” (hoặc làm rõ cơ chế tương đương đáp ứng tiêu chí) để bảo đảm tính phù hợp yêu cầu tiến độ/hỗ trợ.", "evidences": [{"root": {"number": "8.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8513, "content": "8.2. Khi xảy ra Sự kiện Bất khả kháng, Bên bị ảnh hưởng phải thông báo bằng văn bản cho Bên còn lại trong vòng 03 (ba) ngày làm việc kể từ ngày xảy ra sự kiện. Thông báo phải nêu rõ bản chất sự kiện, hậu quả dự kiến, thời gian ảnh hưởng và cung cấp tài liệu chứng minh à toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "18.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7744, "content": "18.4. Khi phương án xử lý được Khách hàng chấp thuận, VTIT sẽ triển khai việc khắc phục trong thời hạn tối đa [12] giờ làm việc đối với lỗi mức độ nghiêm trọng hoặc theo thời gian thống nhất giữa hai Bên nếu lỗi có tính chất phức tạp hoặc phụ thuộc yếu tố hạ tầng/vận hành của Khách hàng."}, "chain": []}, {"root": {"number": "4.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7711, "content": "4.1. Quyền của VTIT: - a) Được Khách hàng thanh toán đầy đủ và đúng hạn theo giá trị nghiệm thu thực tế và phương thức thanh toán quy định tại Hợp đồng này, trên cơ sở hồ sơ thanh toán hợp lệ do VTIT cung cấp;\n\nb) Có quyền từ chối thực hiện hoặc tạm dừng công việc nếu Khách hàng không cung cấp đầy đủ, kịp thời các thông tin, tài liệu, điều kiện cần thiết hoặc không thanh toán đầy đủ và đúng hạn hoặc vi phạm nghĩa vụ làm ảnh hưởng đến tiến độ, chất lượng cung cấp dịch vụ của VTIT;\n\nc) Có quyền sử dụng hợp pháp các kinh nghiệm, phương pháp, quy trình, công cụ, mã nguồn, thư viện phần mềm và các thành phần phần mềm có sẵn của VTIT và/hoặc của nhà cung cấp trong quá trình thực hiện công việc, với điều kiện việc sử dụng đó không xâm phạm quyền sở hữu trí tuệ\n\ncủa bất kỳ bên thứ ba nào và phù hợp với các điều kiện cấp phép áp dụng (nếu có).\n\nd) VTIT không phát sinh trách nhiệm đối với các lỗi, sự cố phát sinh do nguyên nhân từ Khách hàng, hệ thống của Khách hàng hoặc phần mềm bên thứ ba do Khách hàng sử dụng;"}, "chain": [{"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": false, "score": null, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8233, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "REFERS_TO", "children": []}, {"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": []}]}]}, {"root": {"number": "16.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7693, "content": "16.2. Trong trường hợp có nhu cầu thay đổi thời gian cung cấp dịch vụ, Khách hàng phải thông báo trước cho VTIT trong thời hạn tối thiểu 05 ngày làm việc và phải có sự chấp thuận từ VTIT. Các Bên sẽ ký kết Phụ lục điều chỉnh Hợp đồng làm căn cứ thực hiện."}, "chain": []}, {"root": {"number": "16.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7674, "content": "16.4. Trường hợp VTIT chậm cung cấp dịch vụ do các nguyên nhân khách quan hoặc do Khách hàng, bao gồm nhưng không giới hạn ở việc Khách hàng chậm cung cấp thông tin, tài liệu, yêu cầu nghiệp vụ, môi trường kỹ thuật, chậm phản hồi, chậm phê duyệt kết quả công việc hoặc có thay đổi yêu cầu trong quá trình triển khai, thì VTIT có quyền đề nghị điều chỉnh thời gian cung cấp dịch vụ tương ứng với mức độ ảnh hưởng thực tế. Trong các trường hợp này, VTIT sẽ không bị coi là vi phạm Hợp đồng và không phải chịu bất kỳ chế tài nào liên quan đến việc chậm tiến độ."}, "chain": []}, {"root": {"number": "12.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7456, "content": "12.4. Trường hợp Hợp đồng bị chấm dứt trước thời hạn mà không phải do lỗi của VTIT, VTIT vẫn có quyền:\n\na) Yêu cầu thanh toán đầy đủ cho phần công việc đã thực hiện và  được nghiệm thu tính đến thời điểm chấm dứt;\n\nb) Yêu cầu thanh toán các chi phí hợp lý đã phát sinh đối với phần công việc đang thực hiện dở dang (nếu có), trên cơ sở tài liệu, chứng từ hợp lệ được Khách hàng xác nhận;\n\nc) Không bị coi là vi phạm Hợp đồng hoặc chịu phạt vi phạm do việc chấm dứt không thuộc lỗi của mình."}, "chain": []}, {"root": {"number": "15.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7307, "content": "15.3. Thời hạn và hồ sơ thanh toán:\n\na) Tạm ứng: Khách hàng sẽ tạm ứng cho VTIT một khoản tiền tương ứng với 30% (ba mươi phần trăm) giá trị Hợp đồng trong vòng 05 (năm) ngày làm việc kể từ ngày Khách hàng nhận được đầy đủ hồ sơ tạm ứng do VTIT cung cấp, bao gồm:\n\n- (i) Hợp đồng đã được hai Bên ký kết; và\n\n- (ii) Đề nghị tạm ứng.\n\nb) Nguyên tắc khấu trừ tạm ứng: Khoản tạm ứng quy định tại điểm a) nêu trên sẽ được khấu trừ dần vào các khoản thanh toán tại các đợt thanh toán lần 1 và lần 2 theo tỷ lệ tương ứng với giá trị mỗi đợt thanh toán.\n\nc) Thanh toán lần 1 - Sau khi ký Biên bản bàn giao phần mềm (HOC)::\n\nKhách hàng sẽ thanh toán cho VTIT khoản tiền tương ứng với 65% ( Sáu mươi lăm phần trăm ) giá trị Hợp đồng sau khi khấu trừ phần tạm ứng tương ứng theo điểm b) trong vòng 05 (năm) ngày làm việc kể từ ngày Khách hàng nhận được đầy đủ hồ sơ thanh toán hợp lệ bao gồm:\n\n- (i) Biên bản bàn giao phần mềm (HOC); và\n\n- (ii) Đề nghị thanh toán.\n\nd) Thanh toán lần 2 - Sau khi ký Biên bản nghiệm thu tổng thể (FAC):\n\nKhách hàng sẽ thanh toán cho VTIT toàn bộ khoản tiền còn lại tương ứng với 5% (Năm phần trăm) giá trị Hợp đồng, sau khi khấu trừ toàn bộ phần tạm ứng chưa được khấu trừ (nếu có), trong vòng 05 (năm) ngày làm việc kể từ ngày Khách hàng nhận được đầy đủ hồ sơ thanh toán hợp lệ bao gồm:\n\n- (i) Biên bản nghiệm thu tổng thể (FAC);\n\n- (ii) Đề nghị thanh toán;\n\n- (iii) Hóa đơn giá trị gia tăng hợp lệ tương ứng."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8233, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}, {"item_id": "CL-17", "category": "Nhân sự, bàn giao và bảo hành", "question": "Các điều khoản về nhân sự chủ chốt, bàn giao, nghiệm thu, hỗ trợ sau nghiệm thu đã phù hợp chưa?", "status": "fail", "evidence": "Các điều khoản được cung cấp có liên quan trực tiếp/gián tiếp tới mục nhân sự chủ chốt, bàn giao, nghiệm thu, hỗ trợ và bảo hành: Điều 0 (thông tin các Bên/đại diện), Điều 7.2-7.4 (non-solicitation), Điều 3.2.2(b) (nghĩa vụ Khách hàng cử cán bộ làm đầu mối), Điều 4.2(b), (d), (f) (nghĩa vụ VTIT lập kế hoạch và cung cấp hồ sơ/tài liệu phục vụ nghiệm thu-thanh toán), Điều 17.5 (khắc phục/chỉnh sửa và bàn giao lại), Điều 18.2-18.5 (bảo hành: thời hạn phản hồi/khắc phục bằng giờ làm việc nhưng không nêu thời gian bảo hành tổng thể, chỉ mô tả phạm vi loại trừ), Điều 16.2 (thay đổi thời gian cung cấp dịch vụ: thông báo trước tối thiểu 05 ngày làm việc).", "reasoning": "Hợp đồng có điều khoản non-solicitation đáp ứng thời hạn 12 tháng sau chấm dứt (Điều 7.2). Phạm vi bảo hành được mô tả tương đối rõ (Điều 18.2, 18.5). Tuy nhiên còn thiếu/không đủ bằng chứng cho các yêu cầu khác của mục này: chưa chỉ định rõ đầu mối phụ trách của VTIT và Khách hàng; chưa có quy trình thay thế đầu mối với thời hạn thông báo 15–30 ngày; chưa có danh mục tài liệu bàn giao liệt kê cụ thể; và thời gian bảo hành tổng thể không được xác định theo tháng tối thiểu 12 tháng (Điều 18 chỉ thể hiện thời hạn phản hồi/khắc phục theo giờ làm việc).", "recommendation": "Đề nghị bổ sung/cụ thể hóa: (i) điều khoản chỉ định đầu mối phụ trách của VTIT và Khách hàng (tên/vai trò) kèm cơ chế liên hệ; (ii) quy trình thay thế đầu mối kèm thời hạn thông báo trước 15–30 ngày; (iii) danh mục tài liệu bàn giao cụ thể (ví dụ: HOC/PAC/FAC, tài liệu hướng dẫn, tài liệu kỹ thuật, mã nguồn, cấu hình, biên bản nghiệm thu… theo định dạng/phiên bản); (iv) điều khoản thời hạn bảo hành tính theo tháng tối thiểu 12 tháng và nêu rõ phạm vi bảo hành áp dụng trong suốt thời hạn đó (không chỉ thời hạn phản hồi/khắc phục).", "evidences": [{"root": {"number": "7.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8043, "content": "7.2. Trong thời gian thực hiện Hợp đồng và trong vòng 12 tháng kể từ ngày Hợp đồng chấm dứt hoặc hết hạn vì bất kỳ lý do nào, Khách hàng cam kết:\n\na) Không trực tiếp hoặc gián tiếp tuyển dụng, thuê, mời làm việc, lôi kéo hoặc khuyến khích bất kỳ nhân sự nào (bao gồm cán bộ, nhân viên, thực tập sinh, cộng tác viên và các nhân sự khác) của VTIT mà Khách hàng đã biết hoặc tiếp xúc trong quá trình thực hiện Hợp đồng;\n\nb) Không đề nghị, khuyến khích hoặc hỗ trợ bất kỳ nhân sự nào của VTIT chấm dứt hợp đồng lao động, hợp tác hoặc quan hệ làm việc với VTIT."}, "chain": []}, {"root": {"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.803, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này."}, "chain": []}, {"root": {"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": true, "score": 0.7977, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.803, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "REFERS_TO", "children": []}, {"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "9.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7946, "content": "9.1. Trừ khi có sự đồng ý trước bằng văn bản của Bên còn lại, mỗi Bên không được phép chuyển nhượng toàn bộ hoặc một phần quyền và/hoặc nghĩa vụ của mình theo Hợp đồng này cho bất kỳ bên thứ ba nào khác.\n\nQuy định tại khoản này không áp dụng trong trường hợp một Bên thực hiện việc chuyển giao Hợp đồng theo quy định pháp luật trong quá trình sáp nhập, hợp nhất, chia tách, giải thể. Khi đó, Bên thực hiện chuyển giao có trách nhiệm thông báo trước cho Bên còn lại bằng văn bản và phối hợp để bảo đảm việc kế thừa quyền và nghĩa vụ theo Hợp đồng được thực hiện hợp pháp, liên tục và không ảnh hưởng đến quyền lợi của Bên còn lại."}, "chain": []}, {"root": {"number": "14.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7916, "content": "14.3. Giới hạn phạm vi\n\nTrừ khi Hợp đồng và các Phụ lục có quy định khác, phạm vi Dịch vụ không bao gồm: (i) cung cấp hạ tầng (máy chủ, đường truyền, thiết bị, bản quyền bên thứ ba); (ii) vận hành/điều hành hệ thống của Khách hàng; (iii) nhập liệu, làm sạch dữ liệu; (iv) tích hợp với hệ thống/đối tác bên thứ ba không nêu trong Phụ lục 01; (v) đào tạo, chuyển giao, bảo trì/mở rộng sau nghiệm thu; và/hoặc (vi) các công việc phát sinh theo yêu cầu không được xác nhận theo khoản 4 Điều này.\n\nTrong trường hợp Khách hàng có yêu cầu cung cấp các Dịch vụ nêu trên thì Các Bên sẽ thống nhất phạm vi và phí dịch vụ bằng văn bản trước khi thực hiện."}, "chain": []}, {"root": {"number": "18.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7911, "content": "18.3. Sau khi nhận được yêu cầu bảo hành chính thức bằng văn bản hoặc qua điện thoại/email từ Khách hàng, VTIT có trách nhiệm phản hồi trong vòng [12] giờ làm việc kể từ thời điểm nhận được yêu cầu và cử cán bộ kỹ thuật đánh giá lỗi để đề xuất phương án xử lý trong thời hạn hợp lý, tùy theo tính chất lỗi."}, "chain": []}, {"root": {"number": "18.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7898, "content": "18.4. Khi phương án xử lý được Khách hàng chấp thuận, VTIT sẽ triển khai việc khắc phục trong thời hạn tối đa [12] giờ làm việc đối với lỗi mức độ nghiêm trọng hoặc theo thời gian thống nhất giữa hai Bên nếu lỗi có tính chất phức tạp hoặc phụ thuộc yếu tố hạ tầng/vận hành của Khách hàng."}, "chain": []}, {"root": {"number": "4.2", "title": "", "is_appendix": false, "matched": true, "score": 0.788, "content": "4.2. Nghĩa vụ của VTIT:\n\na) Cung cấp dịch vụ phần mềm cho Khách hàng theo đúng nội dung, phạm vi và tiêu chuẩn kỹ thuật được quy định tại Hợp đồng, Phiếu giao công việc, Danh sách công việc hoặc các tài liệu giao việc khác đã được Các Bên thống nhất bằng văn bản;\n\nb) Có trách nhiệm tiếp nhận kế hoạch công việc và xây dựng kế hoạch triển khai, bàn giao phù hợp theo thỏa thuận của Các Bên. Kế hoạch công việc phải được xác nhận bằng văn bản giữa Các Bên trước khi triển khai;\n\nc) Chịu trách nhiệm bảo quản, giữ gìn và sử dụng đúng mục đích các hệ thống, thiết bị, cơ sở vật chất mà Khách hàng đã bàn giao phục vụ cho việc thực hiện dịch vụ theo Hợp đồng (nếu có);\n\nd) Thực hiện đầy đủ và đúng tiến độ các công việc được giao theo kế hoạch, đảm bảo tuân thủ yêu cầu kỹ thuật, chất lượng sản phẩm và bàn giao đầy đủ các tài liệu, sản phẩm liên quan theo đúng quy định trong Hợp đồng.\n\ne) Tuân thủ các yêu cầu, hướng dẫn nghiệp vụ của Khách hàng trong phạm vi  Dịch  vụ  và  phù  hợp  với  Hợp  đồng/Phụ  lục,  với  điều  kiện  các  yêu cầu/hướng dẫn đó không làm thay đổi phạm vi, tiêu chuẩn kỹ thuật, tiến độ hoặc chi phí đã thỏa thuận;\n\nf) Cung cấp đầy đủ, kịp thời các hồ sơ, tài liệu, biên bản, báo cáo liên quan phục vụ công tác nghiệm thu và thanh toán theo quy định tại Hợp đồng.\n\n7. 4.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật."}, "chain": [{"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": true, "score": 0.7977, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.803, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "REFERS_TO", "children": []}, {"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": []}]}]}, {"root": {"number": "16.2", "title": "", "is_appendix": false, "matched": true, "score": 0.786, "content": "16.2. Trong trường hợp có nhu cầu thay đổi thời gian cung cấp dịch vụ, Khách hàng phải thông báo trước cho VTIT trong thời hạn tối thiểu 05 ngày làm việc và phải có sự chấp thuận từ VTIT. Các Bên sẽ ký kết Phụ lục điều chỉnh Hợp đồng làm căn cứ thực hiện."}, "chain": []}, {"root": {"number": "18.5", "title": "", "is_appendix": false, "matched": true, "score": 0.7831, "content": "18.5. VTIT không chịu trách nhiệm bảo hành hoặc khắc phục lỗi đối với các sự cố phát sinh sau nghiệm thu do thay đổi hệ thống, can thiệp kỹ thuật, cấu hình hoặc sử dụng sai hướng dẫn từ phía Khách hàng hoặc bên thứ ba khác không phải do\n\n- VTIT triển khai. Việc khắc phục trong các trường hợp này (nếu có) sẽ được tính là dịch vụ phát sinh và thanh toán riêng theo thỏa thuận."}, "chain": []}, {"root": {"number": "18.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7826, "content": "18.2. Các dịch vụ bảo hành bao gồm việc sửa lỗi chức năng Hệ thống do VTIT xây dựng. VTIT không chịu trách nhiệm bảo hành đối với bất kỳ hỏng hóc hoặc tình huống nào xảy ra do nguyên nhân là lỗi chương trình khác, phần mềm hệ thống, phần mềm hệ điều hành, phần mềm mạng hoặc những lỗi do môi trường, vận hành, dữ liệu, lỗi phần cứng và các vấn đề phát sinh khác không phải do lỗi hoàn toàn của VTIT.\n\nVTIT cũng không chịu trách nhiệm bảo hành đối với thiệt hại gián tiếp, lợi nhuận bị mất hoặc tổn thất do việc gián đoạn hoạt động kinh doanh của Khách hàng, trừ khi có thỏa thuận cụ thể khác bằng văn bản."}, "chain": []}, {"root": {"number": "17.5", "title": "", "is_appendix": false, "matched": true, "score": 0.7814, "content": "17.5. VTIT có trách nhiệm khắc phục, chỉnh sửa và bàn giao lại trong thời hạn hợp lý theo thỏa thuận với Khách hàng. Trong mọi trường hợp, Khách hàng phải phối hợp và cung cấp đầy đủ thông tin phản hồi, tài liệu và hỗ trợ kỹ thuật để VTIT có đủ điều kiện khắc phục."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.803, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "2.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7789, "content": "2.4. Các tài liệu kèm theo khác (nếu có)."}, "chain": []}, {"root": {"number": "9.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7728, "content": "9.2. Trong mọi trường hợp, Bên chuyển nhượng vẫn phải chịu trách nhiệm liên đới về việc đảm bảo Bên nhận chuyển nhượng tuân thủ đầy đủ các nghĩa vụ theo Hợp đồng này, trừ khi Các Bên có thỏa thuận khác bằng văn bản."}, "chain": []}, {"root": {"number": "12.2", "title": "", "is_appendix": false, "matched": true, "score": 0.77, "content": "12.2. Một trong Hai Bên có quyền chấm dứt Hợp đồng nếu Bên kia có hành vi vi phạm cơ bản nghĩa vụ hợp đồng, bao gồm nhưng không giới hạn ở:\n\na) Không thực hiện nghĩa vụ thanh toán trong thời hạn quá 30 ngày kể từ ngày đến hạn mà không có lý do chính đáng hoặc không được khắc phục sau khi nhận được thông báo bằng văn bản từ Bên còn lại;\n\nb) Từ chối bàn giao hoặc từ chối thực hiện Hợp đồng hoặc đơn phương đình chỉ công việc trái Hợp đồng;\n\nc) Một Bên vi phạm cam đoan và bảo đảm theo quy định tại khoản 10.1 Điều 11 Hợp đồng này.\n\nd) VTIT có quyền chấm dứt Hợp đồng nếu Khách hàng mất khả năng thanh toán hoặc có căn cứ hợp lý để xác định Khách hàng không còn khả năng thanh toán các khoản đến hạn theo Hợp đồng.\n\ne) Vi phạm nghiêm trọng nghĩa vụ Hợp đồng.\n\nTrong các trường hợp này, Bên bị vi phạm phải được thông báo bằng văn bản và có ít nhất 15 ngày làm việc để khắc phục trước khi Bên kia chính thức chấm dứt Hợp đồng."}, "chain": [{"number": "10.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "10.1. Các Bên cam đoan và bảo đảm rằng:\n\na) Có đầy đủ năng lực pháp lý, tư cách pháp nhân và quyền ký kết và thực hiện Hợp đồng này theo quy định của pháp luật;\n\nb) Phần mềm, hệ thống là phù hợp với quy định của pháp luật hiện hành, không vi phạm bất kỳ quy định cấm nào, không bị cấm phát triển hoặc sử dụng theo pháp luật Việt Nam hoặc điều ước quốc tế có hiệu lực; việc xây dựng Phần mềm, hệ thống không làm phát sinh trách nhiệm pháp lý cho VTIT với tư cách là bên cung cấp dịch vụ.\n\nc) Phần mềm/hệ thống và/hoặc Dịch vụ theo Hợp đồng không được sử dụng, trực tiếp hoặc gián tiếp, cho bất kỳ mục đích nào liên quan đến khủng bố,\n\ntài trợ khủng bố, tội phạm xuyên quốc gia/tội phạm quốc tế, rửa tiền, buôn bán người, hoặc các hành vi bị cấm theo pháp luật Việt Nam và/hoặc các điều ước quốc tế có hiệu lực; Khách hàng cam kết bảo đảm việc sử dụng là hợp pháp và bồi thường, giữ cho VTIT không bị thiệt hại trước mọi khiếu nại, yêu cầu, chế tài phát sinh từ việc Khách hàng vi phạm cam kết này.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.803, "content": "1.2.
