n, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "6.5", "title": "", "is_appendix": false, "matched": true, "score": 0.812, "content": "6.5. Các Bên có nghĩa vụ tuân thủ Thỏa thuận về Bảo vệ dữ liệu cá nhân theo Phụ lục 03 đính kèm Hợp đồng này."}, "chain": [{"number": "6.1", "title": "", "is_appendix": false, "matched": true, "score": 0.8618, "content": "6.1. Các Bên cam kết giữ bí mật tất cả các thông tin, báo cáo, tài liệu, dữ liệu có được từ Bên kia theo Hợp đồng. Không có sự đồng ý trước bằng văn bản của Bên cung cấp thông tin, Bên nhận thông tin không được tiết lộ bất kì thông tin, báo cáo, tài liệu và dữ liệu của Bên cung cấp thông tin cho Bên thứ ba. Các Bên cam kết tiến hành các  biện pháp bảo mật và các hoạt động dự phòng cần thiết và phù hợp để đảm bảo giữ bí mật những thông tin trên và đảm bảo những thông tin này không bị sử dụng sai mục đích trong quá trình thực hiện và sau khi kết thúc Hợp đồng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": true, "score": 0.8092, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8311, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "REFERS_TO", "children": []}, {"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "6.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8077, "content": "6.2. Những hạn chế tại khoản 1 Điều này sẽ không áp dụng đối với một trong số các thông tin sau:\n\na) Thông tin mà Bên nhận có thể chứng minh đã biết từ nguồn hợp  pháp không liên quan đến Bên cung cấp trước thời điểm nhận được thông tin từ Bên cung cấp; Thông tin đã công khai hoặc trở nên công khai mà không phải do hành vi vi phạm của Bên nhận;\n\nb) Thông tin do Bên nhận tự phát triển một cách độc lập mà không sử dụng Thông tin mật của Bên cung cấp;\n\nc) Thông tin được tiết lộ theo yêu cầu của pháp luật, cung cấp cho tòa án, trọng tài thương mại hoặc cơ quan nhà nước có thẩm quyền;\n\nd) Những thông tin bị tiết lộ cho công ty mẹ, các công ty thành viên của Một Bên, các cán bộ, nhân viên, người làm công, các đại lý, bên tư vấn, cung cấp dịch vụ của bên nhận thông tin trong trường hợp việc tiết lộ đó là cần thiết để thực hiện Hợp đồng, với điều kiện các bên được tiết lộ có nghĩa vụ bảo mật tương tự như quy định tại Hợp đồng này."}, "chain": [{"number": "6.1", "title": "", "is_appendix": false, "matched": true, "score": 0.8618, "content": "6.1. Các Bên cam kết giữ bí mật tất cả các thông tin, báo cáo, tài liệu, dữ liệu có được từ Bên kia theo Hợp đồng. Không có sự đồng ý trước bằng văn bản của Bên cung cấp thông tin, Bên nhận thông tin không được tiết lộ bất kì thông tin, báo cáo, tài liệu và dữ liệu của Bên cung cấp thông tin cho Bên thứ ba. Các Bên cam kết tiến hành các  biện pháp bảo mật và các hoạt động dự phòng cần thiết và phù hợp để đảm bảo giữ bí mật những thông tin trên và đảm bảo những thông tin này không bị sử dụng sai mục đích trong quá trình thực hiện và sau khi kết thúc Hợp đồng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "12.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7853, "content": "12.2. Một trong Hai Bên có quyền chấm dứt Hợp đồng nếu Bên kia có hành vi vi phạm cơ bản nghĩa vụ hợp đồng, bao gồm nhưng không giới hạn ở:\n\na) Không thực hiện nghĩa vụ thanh toán trong thời hạn quá 30 ngày kể từ ngày đến hạn mà không có lý do chính đáng hoặc không được khắc phục sau khi nhận được thông báo bằng văn bản từ Bên còn lại;\n\nb) Từ chối bàn giao hoặc từ chối thực hiện Hợp đồng hoặc đơn phương đình chỉ công việc trái Hợp đồng;\n\nc) Một Bên vi phạm cam đoan và bảo đảm theo quy định tại khoản 10.1 Điều 11 Hợp đồng này.\n\nd) VTIT có quyền chấm dứt Hợp đồng nếu Khách hàng mất khả năng thanh toán hoặc có căn cứ hợp lý để xác định Khách hàng không còn khả năng thanh toán các khoản đến hạn theo Hợp đồng.\n\ne) Vi phạm nghiêm trọng nghĩa vụ Hợp đồng.\n\nTrong các trường hợp này, Bên bị vi phạm phải được thông báo bằng văn bản và có ít nhất 15 ngày làm việc để khắc phục trước khi Bên kia chính thức chấm dứt Hợp đồng."}, "chain": [{"number": "10.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "10.1. Các Bên cam đoan và bảo đảm rằng:\n\na) Có đầy đủ năng lực pháp lý, tư cách pháp nhân và quyền ký kết và thực hiện Hợp đồng này theo quy định của pháp luật;\n\nb) Phần mềm, hệ thống là phù hợp với quy định của pháp luật hiện hành, không vi phạm bất kỳ quy định cấm nào, không bị cấm phát triển hoặc sử dụng theo pháp luật Việt Nam hoặc điều ước quốc tế có hiệu lực; việc xây dựng Phần mềm, hệ thống không làm phát sinh trách nhiệm pháp lý cho VTIT với tư cách là bên cung cấp dịch vụ.\n\nc) Phần mềm/hệ thống và/hoặc Dịch vụ theo Hợp đồng không được sử dụng, trực tiếp hoặc gián tiếp, cho bất kỳ mục đích nào liên quan đến khủng bố,\n\ntài trợ khủng bố, tội phạm xuyên quốc gia/tội phạm quốc tế, rửa tiền, buôn bán người, hoặc các hành vi bị cấm theo pháp luật Việt Nam và/hoặc các điều ước quốc tế có hiệu lực; Khách hàng cam kết bảo đảm việc sử dụng là hợp pháp và bồi thường, giữ cho VTIT không bị thiệt hại trước mọi khiếu nại, yêu cầu, chế tài phát sinh từ việc Khách hàng vi phạm cam kết này.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8311, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}]}, {"item_id": "CL-06", "category": "Kiểm soát xuất nhập khẩu", "question": "Việc kiểm soát xuất khẩu, nhập khẩu phần mềm/hàng hóa (nếu có) có tuân thủ quy định pháp luật không?", "status": "fail", "evidence": "- Điều 10.1(b): “Phần mềm, hệ thống… không vi phạm bất kỳ quy định cấm nào…”.\n- Điều 10.1(c): “Phần mềm/hệ thống và/hoặc Dịch vụ… không được sử dụng… cho bất kỳ mục đích nào liên quan đến khủng bố, tài trợ khủng bố, tội phạm xuyên quốc gia/tội phạm quốc tế, rửa tiền, buôn bán người, hoặc các hành vi bị cấm…”.\n- Không trích dẫn điều khoản nào về: (i) xác định hàng hóa/phần mềm thuộc phạm vi EAR; (ii) cấm xuất khẩu sang/đến mục đích theo EAR; (iii) cấm sử dụng cho mục đích quân sự theo EAR.", "reasoning": "Hợp đồng được cung cấp có cam kết về việc không sử dụng phần mềm/hệ thống cho các mục đích bị cấm theo pháp luật Việt Nam/điều ước quốc tế (Điều 10.1(c)), tuy nhiên không có bằng chứng trong các điều khoản truy hồi về việc đối chiếu phạm vi EAR hoặc có điều khoản cấm xuất khẩu/cấm sử dụng cho mục đích quân sự theo yêu cầu của checklist. Vì thiếu bằng chứng đáp ứng các tiêu chí nêu, các hạng mục tương ứng được đánh giá là không đạt.", "recommendation": "Bổ sung điều khoản kiểm soát xuất khẩu theo EAR (hoặc cơ chế tương đương) trong Hợp đồng/Phụ lục, tối thiểu gồm: (i) xác nhận phạm vi áp dụng EAR đối với deliverables (nếu có/không), (ii) nghĩa vụ của Khách hàng không xuất khẩu/tái xuất khẩu hàng hóa/phần mềm theo các điều kiện bị hạn chế, (iii) nghĩa vụ không sử dụng cho mục đích quân sự và/hoặc các mục đích bị cấm theo yêu cầu của EAR (kèm cơ chế tuân thủ, thông báo vi phạm nếu phát sinh).", "evidences": [{"root": {"number": "13.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7634, "content": "13.1. Hợp đồng được điều chỉnh và giải thích theo pháp luật Việt Nam."}, "chain": []}, {"root": {"number": "6.1", "title": "", "is_appendix": false, "matched": true, "score": 0.76, "content": "6.1. Các Bên cam kết giữ bí mật tất cả các thông tin, báo cáo, tài liệu, dữ liệu có được từ Bên kia theo Hợp đồng. Không có sự đồng ý trước bằng văn bản của Bên cung cấp thông tin, Bên nhận thông tin không được tiết lộ bất kì thông tin, báo cáo, tài liệu và dữ liệu của Bên cung cấp thông tin cho Bên thứ ba. Các Bên cam kết tiến hành các  biện pháp bảo mật và các hoạt động dự phòng cần thiết và phù hợp để đảm bảo giữ bí mật những thông tin trên và đảm bảo những thông tin này không bị sử dụng sai mục đích trong quá trình thực hiện và sau khi kết thúc Hợp đồng."}, "chain": []}, {"root": {"number": "12.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7584, "content": "12.1. Hợp đồng chấm dứt trong các trường hợp sau:\n\na) Hợp đồng đã được Các Bên thực hiện đầy đủ nghĩa vụ theo quy định tại Hợp đồng.\n\nb) Các Bên có thỏa thuận chấm dứt Hợp đồng bằng văn bản. Trong trường hợp này, Hai Bên sẽ thống nhất các điều kiện cụ thể liên quan đến việc chấm dứt, bao gồm nhưng không giới hạn ở: trách nhiệm thanh toán, thời điểm hiệu lực chấm dứt, nghĩa vụ bảo mật và xử lý dữ liệu.\n\nc) Một trong Hai Bên bị tuyên bố phá sản, giải thể, hoặc bị cơ quan có thẩm quyền yêu cầu chấm dứt hoạt động kinh doanh."}, "chain": []}, {"root": {"number": "2.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7583, "content": "2.2. Các Phụ lục đính kèm Hợp đồng;"}, "chain": []}, {"root": {"number": "10.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7575, "content": "10.3. VTIT cam đoan và bảo đảm rằng: - a) Có đầy đủ năng lực kỹ thuật, kinh nghiệm và nguồn lực cần thiết để thực hiện đúng và đầy đủ các nghĩa vụ đã cam kết trong Hợp đồng;\n\nb) Trong quá trình thực hiện Hợp đồng, sẽ không vi quyền sở hữu trí tuệ của bên thứ ba;\n\nc) Dịch vụ và sản phẩm bàn giao theo Hợp đồng sẽ đáp ứng các yêu cầu kỹ thuật, chức năng như đã thỏa thuận tại Hợp đồng và các Phụ lục kèm theo."}, "chain": []}, {"root": {"number": "9.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7518, "content": "9.2. Trong mọi trường hợp, Bên chuyển nhượng vẫn phải chịu trách nhiệm liên đới về việc đảm bảo Bên nhận chuyển nhượng tuân thủ đầy đủ các nghĩa vụ theo Hợp đồng này, trừ khi Các Bên có thỏa thuận khác bằng văn bản."}, "chain": []}, {"root": {"number": "5.5", "title": "", "is_appendix": false, "matched": true, "score": 0.7504, "content": "5.5. Quyền sở hữu trí tuệ của các Bên đối với Phần mềm được xác định như sau:\n\n## Mô hình 1: Client-owned IP (KH sở hữu sản phẩm bàn giao)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ (bao gồm quyền tác giả đối với chương trình máy tính, quyền liên quan và các quyền tài sản khác theo pháp luật) đối với các hạng mục  bàn giao/deliverables được tạo ra riêng cho Khách hàng trong quá trình thực hiện Dịch vụ ('Sản phẩm bàn giao') sẽ thuộc về Khách hàng.\n\n- b. Kể từ thời điểm nêu trên, VTIT chuyển giao cho Khách hàng các quyền tài sản tương ứng đối với Sản phẩm bàn giao trong phạm vi pháp luật cho phép; Khách hàng có quyền sử dụng, khai thác, sửa đổi, sao chép, phát triển theo mục đích quy định tại Hợp đồng này.\n\n- c. VTIT cam kết không tái sử dụng Sản phẩm bàn giao (toàn bộ hoặc phần cốt lõi mang tính đặc thù của Khách hàng) cho khách hàng khác, trừ (i) phần thuộc Tài sản có sẵn/Background IP của VTIT; và/hoặc (ii) các thành phần mã nguồn mở/được cấp phép hợp pháp.\n\n## Mô hình 2: Vendor-owned IP (VTIT sở hữu bản quyền)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ đối với Sản phẩm bàn giao (bao gồm mọi cải tiến/phát triển phát sinh trong quá trình thực hiện Dịch vụ) sẽ thuộc về VTIT.\n\n- b. VTIT cấp cho Khách hàng một giấy phép sử dụng Sản phẩm bàn giao trọn đời, không độc quyền, không chuyển nhượng, không được cấp lại nếu không có chấp thuận bằng văn bản của VTIT, trong phạm vi mục đích sử dụng theo Hợp đồng/Phụ lục.\n\n- c. Khách hàng không được (và không được cho  phép bên khác) thực hiện reverse  engineering  (phân  tích  ngược/dịch  ngược),  decompile  (giải  biên dịch), disassemble (tháo rời/dịch ngược sang mã máy/assembly), tách/chiết mã nguồn, hoặc tạo sản phẩm phái sinh nhằm thương mại hóa/phân phối lại Sản phẩm bàn giao, trừ khi pháp luật bắt buộc. VTIT được quyền tái sử dụng,  cung  cấp  cho  khách  hàng  khác  các  thành  phần  chung/khung  kỹ thuật/know-how, với điều kiện không tiết lộ Thông tin mật của Khách hàng.\n\n## Mô hình 3 - Pre-existing IP (Background IP gixisting IP tạo sản phẩm phái sinh\n\n- a. 'Background IP' là toàn bộ mã nguồn, công cụ, thư viện, framework, tài liệu, quy trình, bí quyết kỹ thuật, nền tảng phần mềm và/hoặc các thành phần khác mà VTIT (hoặc bên cấp phép hợp pháp cho VTIT) đã sở hữu/có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập, không phụ thuộc vào dự án. Background IP thuộc sở hữu của VTIT (hoặc chủ thể có quyền), và không chuyển giao cho Khách hàng theo Hợp đồng này.\n\n- b. 'Project IP' là các hạng mục được phát triển riêng theo yêu cầu của Khách hàng  trong  phạm  vi  Dịch  vụ  (ví  dụ:  chức  năng,  luồng  nghiệp  vụ,  cấu hình/tùy  biến,  tài  liệu  đặc  thù,  mã  nguồn  custom  nếu  có).  Trừ  khi  Hợp đồng/Phụ lục quy định khác, Project IP sẽ thuộc về Khách hàng.\n\n- c. Trong phạm vi cần thiết để Khách hàng khai thác Project IP/Sản phẩm bàn giao, VTIT cấp cho Khách hàng giấy phép sử dụng Background IP trọn đời, không độc quyền, không chuyển nhượng, chỉ để vận hành/khai thác Sản phẩm bàn giao theo Hợp đồng.\n\n## Mô hình 4 - Đồng sở hữu; cả hai Bên được khai thác thương mại; VTIT độc quyền quyền đăng ký/đứng tên\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, các hạng mục/deliverables được tạo ra trong quá trình thực hiện Dịch vụ theo Hợp đồng ('Sản phẩm') là tài sản đồng sở hữu của VTIT và Khách hàng đối với phần quyền tài sản theo pháp luật về sở hữu trí tuệ, kể từ thời điểm Khách hàng hoàn tất thanh toán đầy đủ mọi khoản đến hạn theo Hợp đồng.\n\n- b. Quyền khai thác của các Bên: Mỗi Bên có quyền độc lập khai thác thương mại Sản phẩm (bao gồm phát triển, nâng cấp, phân phối, chuyển giao/cấp phép quyền sử dụng, cung cấp dưới dạng dịch vụ, cho thuê hoặc hình thức thương mại hợp pháp khác) cho bên thứ ba mà không phải xin chấp thuận của Bên còn lại, với điều kiện: (i) không tiết lộ Thông tin mật của Bên còn lại; (ii) không sử dụng dữ liệu, nhãn hiệu, tên thương mại, dấu hiệu nhận diện và/hoặc các tài sản riêng của Bên còn lại nếu không có chấp thuận bằng  văn  bản;  và  (iii)  tuân  thủ  các  nghĩa  vụ/bảo  lưu  quyền  đối  với Background IP và/hoặc mã nguồn mở (OSS) (nếu có).\n\n- c. Quyền đăng ký và đứng tên: VTIT là bên duy nhất có quyền nộp đơn, thực hiện thủ tục đăng ký (và đứng tên trên Giấy chứng nhận, nếu được cấp) đối với quyền tác giả/chương trình máy tính và/hoặc quyền sở hữu trí tuệ liên quan đến Sản phẩm. Việc VTIT đứng tên đăng ký không làm thay đổi bản chất đồng sở hữu và quyền khai thác của Khách hàng theo khoản 1 và khoản 2 Điều này.\n\n- d. Bảo lưu Background IP và OSS: Mọi tài sản có sẵn/Background IP của mỗi Bên và/hoặc các thành phần mã nguồn mở (OSS) được sử dụng trong Sản phẩm (nếu có) vẫn thuộc chủ sở hữu tương ứng và/hoặc tuân theo điều kiện giấy phép áp dụng; điều khoản đồng sở hữu tại Điều này không được hiểu là chuyển giao quyền sở hữu đối với Background IP/OSS.\n\nCác Bên lựa chọn Mô hình 1 để điều chỉnh quyền sở hữu trí tuệ trong Hợp đồng này."}, "chain": [{"number": "5.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.2. Sau khi VTIT hoàn thành việc bàn giao kết quả công việc cho Khách hàng và Khách hàng đã thanh toán đầy đủ cho VTIT theo quy định tại Hợp đồng, Khách hàng sẽ nhận được đầy đủ quyền sở hữu trí tuệ theo quy định tại khoản 5.6 Điều này.", "relation": "REFERS_TO", "children": [{"number": "5.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.1. VTIT cam kết không vi phạm bất kỳ quyền sở hữu trí tuệ nào của bên thứ ba hoặc sử dụng tài sản trí tuệ chưa được cấp phép hợp pháp trong quá trình cung cấp dịch vụ theo Hợp đồng này. Trường hợp có tranh chấp phát sinh liên quan đến quyền sở hữu trí tuệ do lỗi của VTIT, VTIT sẽ chịu trách nhiệm giải quyết các tranh chấp phát sinh (nếu có). Tuy nhiên, VTIT không chịu trách nhiệm đối với các nội dung, tài liệu, dữ liệu hoặc yêu cầu do Khách hàng cung cấp gây ra vi phạm.", "relation": "REFERS_TO", "children": []}]}, {"number": "5.3", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.3. VTIT có quyền sử dụng lại các thành phần, công cụ, thư viện, đoạn mã được phát triển sẵn hoặc không mang tính đặc thù cho Khách hàng trong các dự án\n\nkhác, với điều kiện không tiết lộ thông tin bảo mật hoặc vi phạm quyền sở hữu trí tuệ của Khách hàng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"number": "5.4", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.4. Trong quá trình cung cấp Dịch vụ và/hoặc phát triển Sản phẩm bàn giao, VTIT có thể sử dụng một số thành phần phần mềm mã nguồn mở (Open Source Software - OSS) được cấp phép hợp pháp theo các giấy phép mã nguồn mở tương ứng. Việc sử dụng các thành phần OSS này phải tuân thủ đầy đủ các điều kiện của giấy phép OSS áp dụng. Các thành phần OSS (nếu có) không thuộc quyền sở hữu của VTIT và không được chuyển giao quyền sở hữu theo Hợp đồng này; việc sử dụng, khai thác và phân phối các thành phần OSS sẽ tuân theo các điều kiện cấp phép của chủ sở hữu OSS tương ứng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "7.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7501, "content": "7.2. Trong thời gian thực hiện Hợp đồng và trong vòng 12 tháng kể từ ngày Hợp đồng chấm dứt hoặc hết hạn vì bất kỳ lý do nào, Khách hàng cam kết:\n\na) Không trực tiếp hoặc gián tiếp tuyển dụng, thuê, mời làm việc, lôi kéo hoặc khuyến khích bất kỳ nhân sự nào (bao gồm cán bộ, nhân viên, thực tập sinh, cộng tác viên và các nhân sự khác) của VTIT mà Khách hàng đã biết hoặc tiếp xúc trong quá trình thực hiện Hợp đồng;\n\nb) Không đề nghị, khuyến khích hoặc hỗ trợ bất kỳ nhân sự nào của VTIT chấm dứt hợp đồng lao động, hợp tác hoặc quan hệ làm việc với VTIT."}, "chain": []}, {"root": {"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": true, "score": 0.7479, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật."}, "chain": [{"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}, {"root": {"number": "10.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7455, "content": "10.1. Các Bên cam đoan và bảo đảm rằng:\n\na) Có đầy đủ năng lực pháp lý, tư cách pháp nhân và quyền ký kết và thực hiện Hợp đồng này theo quy định của pháp luật;\n\nb) Phần mềm, hệ thống là phù hợp với quy định của pháp luật hiện hành, không vi phạm bất kỳ quy định cấm nào, không bị cấm phát triển hoặc sử dụng theo pháp luật Việt Nam hoặc điều ước quốc tế có hiệu lực; việc xây dựng Phần mềm, hệ thống không làm phát sinh trách nhiệm pháp lý cho VTIT với tư cách là bên cung cấp dịch vụ.\n\nc) Phần mềm/hệ thống và/hoặc Dịch vụ theo Hợp đồng không được sử dụng, trực tiếp hoặc gián tiếp, cho bất kỳ mục đích nào liên quan đến khủng bố,\n\ntài trợ khủng bố, tội phạm xuyên quốc gia/tội phạm quốc tế, rửa tiền, buôn bán người, hoặc các hành vi bị cấm theo pháp luật Việt Nam và/hoặc các điều ước quốc tế có hiệu lực; Khách hàng cam kết bảo đảm việc sử dụng là hợp pháp và bồi thường, giữ cho VTIT không bị thiệt hại trước mọi khiếu nại, yêu cầu, c tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "11.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7404, "content": "11.2. Phạt vi phạm: - a) Trường hợp tiến độ thực hiện và bàn giao kết quả công việc bị chậm trễ so với kế hoạch tháng, và nguyên nhân được xác định là do lỗi của VTIT sau khi đã có đầy đủ thông tin, tài liệu từ Khách hàng, thì VTIT sẽ phải chịu phạt vi phạm 0,05% giá trị phần công việc bị chậm, tổng mức phạt vi phạm không quá 8% giá trị phần nghĩa vụ/công việc bị vi phạm (bị chậm). Trước khi áp dụng phạt, Khách hàng có trách nhiệm thông báo bằng văn bản và cho VTIT thời gian khắc phục hợp lý (tối thiểu 05 ngày làm việc).\n\nb) Nếu kết quả công việc VTIT bàn giao không đạt yêu cầu theo Hợp đồng và Phiếu yêu cầu, và VTIT không khắc phục trong thời hạn hợp lý được Khách hàng thông báo bằng văn bản, thì VTIT phải chịu phạt 0,05 giá trị phần công việc không đạt yêu cầu, tổng mức phạt vi phạm không quá 8% giá trị phần công việc bị vi phạm.\n\nc) Nếu một bên tự ý chấm dứt Hợp đồng mà không có sự thoả thuận trước bằng văn bản với bên kia hoặc không nằm trong các trường hợp được quyền đơn phương chấm dứt theo quy định tại Hợp đồng, quy định pháp\n\nluật thì phải chịu phạt 8% giá trị bị vi phạm. Trong trường hợp này, các Bên xác định giá trị bị vi phạm là giá trị Hợp đồng chưa thực hiện.\n\nd) Nếu Khách hàng không thực hiện hoặc thực hiện không đầy đủ nghĩa vụ thanh toán theo quy định tại Hợp đồng thì Khách hàng phải chịu phạt 0,1% giá trị thanh toán bị chậm cho mỗi ngày chậm thanh toán nhưng tổng số tiền phạt vi phạm không vượt quá 8% giá trị thanh toán bị chậm."}, "chain": []}, {"root": {"number": "2.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7328, "content": "Thành phần Hợp đồng và thứ tự ưu tiên pháp lý như sau :\n\n2.1. Văn bản Hợp đồng;"}, "chain": []}]}, {"item_id": "CL-07", "category": "Phạt vi phạm và bồi thường thiệt hại", "question": "Điều khoản phạt, bồi thường thiệt hại có đảm bảo bảo vệ quyền lợi của Công ty không?", "status": "pass", "evidence": "Điều 11.2 (Phạt vi phạm) và Điều 11.3, 11.4 (Bồi thường thiệt hại; tổng mức phạt và bồi thường; loại trừ thiệt hại gián tiếp/doanh thu/lợi nhuận/kỳ vọng): cụ thể: (i) “tổng mức phạt vi phạm không quá 8% giá trị phần nghĩa vụ/công việc bị vi phạm”; (ii) bồi thường thiệt hại bao gồm “tổn thất thực tế, trực tiếp, có chứng từ”; và “không chịu trách nhiệm đối với các thiệt hại gián tiếp… bao gồm nhưng không giới hạn ở… lợi nhuận… gián đoạn hoạt động… thiệt hại tinh thần…”; (iii) “Tổng mức phạt vi phạm và bồi thường thiệt hại… không vượt quá tổng giá trị Hợp đồng đã thực hiện…”; (iv) “VTIT không chịu trách nhiệm đối với các thiệt hại gián tiếp, doanh thu, lợi nhuận kỳ vọng…”.", "reasoning": "Các điều kiện cốt lõi về chế tài trong Điều 11 đáp ứng tiêu chí trong checklist: mức phạt có trần 8% đối với phần nghĩa vụ/công việc bị vi phạm; có bồi thường thiệt hại theo tổn thất thực tế, trực tiếp kèm chứng từ; có giới hạn trách nhiệm tổng cho phạt và bồi thường không vượt tổng giá trị hợp đồng đã thực hiện và nghiệm thu; và loại trừ rõ thiệt hại gián tiếp/doanh thu/lợi nhuận kỳ vọng.", "recommendation": "Không đề xuất sửa đổi theo mục CL-07 vì các tiêu chí/điểm kiểm tra đều đã được đáp ứng tại Điều 11.", "evidences": [{"root": {"number": "11.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8221, "content": "11.2. Phạt vi phạm: - a) Trường hợp tiến độ thực hiện và bàn giao kết quả công việc bị chậm trễ so với kế hoạch tháng, và nguyên nhân được xác định là do lỗi của VTIT sau khi đã có đầy đủ thông tin, tài liệu từ Khách hàng, thì VTIT sẽ phải chịu phạt vi phạm 0,05% giá trị phần công việc bị chậm, tổng mức phạt vi phạm không quá 8% giá trị phần nghĩa vụ/công việc bị vi phạm (bị chậm). Trước khi áp dụng phạt, Khách hàng có trách nhiệm thông báo bằng văn bản và cho VTIT thời gian khắc phục hợp lý (tối thiểu 05 ngày làm việc).\n\nb) Nếu kết quả công việc VTIT bàn giao không đạt yêu cầu theo Hợp đồng và Phiếu yêu cầu, và VTIT không khắc phục trong thời hạn hợp lý được Khách hàng thông báo bằng văn bản, thì VTIT phải chịu phạt 0,05 giá trị phần công việc không đạt yêu cầu, tổng mức phạt vi phạm không quá 8% giá trị phần công việc bị vi phạm.\n\nc) Nếu một bên tự ý chấm dứt Hợp đồng mà không có sự thoả thuận trước bằng văn bản với bên kia hoặc không nằm trong các trường hợp được quyền đơn phương chấm dứt theo quy định tại Hợp đồng, quy định pháp\n\nluật thì phải chịu phạt 8% giá trị bị vi phạm. Trong trường hợp này, các Bên xác định giá trị bị vi phạm là giá trị Hợp đồng chưa thực hiện.\n\nd) Nếu Khách hàng không thực hiện hoặc thực hiện không đầy đủ nghĩa vụ thanh toán theo quy định tại Hợp đồng thì Khách hàng phải chịu phạt 0,1% giá trị thanh toán bị chậm cho mỗi ngày chậm thanh toán nhưng tổng số tiền phạt vi phạm không vượt quá 8% giá trị thanh toán bị chậm."}, "chain": []}, {"root": {"number": "11.3", "title": "", "is_appendix": false, "matched": true, "score": 0.8171, "content": "11.3. Bồi thường thiệt hại:\n\nNgoài mức phạt như quy định ở Điều 17.2 nêu trên, Bên vi phạm Hợp đồng có trách nhiệm bồi thường thiệt hại cho bên bị vi phạm do hành vi vi phạm Hợp đồng gây ra. Giá trị bồi thường thiệt hại bao gồm giá trị tổn thất thực tế, trực tiếp, có chứng từ chứng minh hợp lý mà Bên bị vi phạm phải chịu. Trừ khi Hợp đồng có quy định rõ khác bằng văn bản, VTIT không chịu trách nhiệm đối với các thiệt hại gián tiếp hoặc hệ quả phát sinh, bao gồm nhưng không giới hạn ở: mất dữ liệu,  mất  doanh  thu,  lợi  nhuận,  mất  cơ  hội  kinh  doanh,  gián  đoạn  hoạt  động  kinh doanh, thiệt hại tinh thần, các khoản trừng phạt hoặc các tổn thất tương tự khác."}, "chain": [{"number": "11.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8221, "content": "11.2. Phạt vi phạm: - a) Trường hợp tiến độ thực hiện và bàn giao kết quả công việc bị chậm trễ so với kế hoạch tháng, và nguyên nhân được xác định là do lỗi của VTIT sau khi đã có đầy đủ thông tin, tài liệu từ Khách hàng, thì VTIT sẽ phải chịu phạt vi phạm 0,05% giá trị phần công việc bị chậm, tổng mức phạt vi phạm không quá 8% giá trị phần nghĩa vụ/công việc bị vi phạm (bị chậm). Trước khi áp dụng phạt, Khách hàng có trách nhiệm thông báo bằng văn bản và cho VTIT thời gian khắc phục hợp lý (tối thiểu 05 ngày làm việc).\n\nb) Nếu kết quả công việc VTIT bàn giao không đạt yêu cầu theo Hợp đồng và Phiếu yêu cầu, và VTIT không khắc phục trong thời hạn hợp lý được Khách hàng thông báo bằng văn bản, thì VTIT phải chịu phạt 0,05 giá trị phần công việc không đạt yêu cầu, tổng mức phạt vi phạm không quá 8% giá trị phần công việc bị vi phạm.\n\nc) Nếu một bên tự ý chấm dứt Hợp đồng mà không có sự thoả thuận trước bằng văn bản với bên kia hoặc không nằm trong các trường hợp được quyền đơn phương chấm dứt theo quy định tại Hợp đồng, quy định pháp\n\nluật thì phải chịu phạt 8% giá trị bị vi phạm. Trong trường hợp này, các Bên xác định giá trị bị vi phạm là giá trị Hợp đồng chưa thực hiện.\n\nd) Nếu Khách hàng không thực hiện hoặc thực hiện không đầy đủ nghĩa vụ thanh toán theo quy định tại Hợp đồng thì Khách hàng phải chịu phạt 0,1% giá trị thanh toán bị chậm cho mỗi ngày chậm thanh toán nhưng tổng số tiền phạt vi phạm không vượt quá 8% giá trị thanh toán bị chậm.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "11.4", "title": "", "is_appendix": false, "matched": true, "score": 0.81, "content": "11.4. Tổng mức phạt vi phạm và bồi thường thiệt hại (nếu có) của VTIT theo Hợp đồng này không vượt quá tổng giá trị Hợp đồng đã thực hiện và được nghiệm thu. VTIT không chịu trách nhiệm đối với các thiệt hại gián tiếp, doanh thu, lợi nhuận kỳ vọng bị mất của Khách hàng hoặc Bên thứ ba."}, "chain": [{"number": "11.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8221, "content": "11.2. Phạt vi phạm: - a) Trường hợp tiến độ thực hiện và bàn giao kết quả công việc bị chậm trễ so với kế hoạch tháng, và nguyên nhân được xác định là do lỗi của VTIT sau khi đã có đầy đủ thông tin, tài liệu từ Khách hàng, thì VTIT sẽ phải chịu phạt vi phạm 0,05% giá trị phần công việc bị chậm, tổng mức phạt vi phạm không quá 8% giá trị phần nghĩa vụ/công việc bị vi phạm (bị chậm). Trước khi áp dụng phạt, Khách hàng có trách nhiệm thông báo bằng văn bản và cho VTIT thời gian khắc phục hợp lý (tối thiểu 05 ngày làm việc).\n\nb) Nếu kết quả công việc VTIT bàn giao không đạt yêu cầu theo Hợp đồng và Phiếu yêu cầu, và VTIT không khắc phục trong thời hạn hợp lý được Khách hàng thông báo bằng văn bản, thì VTIT phải chịu phạt 0,05 giá trị phần công việc không đạt yêu cầu, tổng mức phạt vi phạm không quá 8% giá trị phần công việc bị vi phạm.\n\nc) Nếu một bên tự ý chấm dứt Hợp đồng mà không có sự thoả thuận trước bằng văn bản với bên kia hoặc không nằm trong các trường hợp được quyền đơn phương chấm dứt theo quy định tại Hợp đồng, quy định pháp\n\nluật thì phải chịu phạt 8% giá trị bị vi phạm. Trong trường hợp này, các Bên xác định giá trị bị vi phạm là giá trị Hợp đồng chưa thực hiện.\n\nd) Nếu Khách hàng không thực hiện hoặc thực hiện không đầy đủ nghĩa vụ thanh toán theo quy định tại Hợp đồng thì Khách hàng phải chịu phạt 0,1% giá trị thanh toán bị chậm cho mỗi ngày chậm thanh toán nhưng tổng số tiền phạt vi phạm không vượt quá 8% giá trị thanh toán bị chậm.", "relation": "REFERS_TO", "children": []}, {"number": "11.3", "title": "", "is_appendix": false, "matched": true, "score": 0.8171, "content": "11.3. Bồi thường thiệt hại:\n\nNgoài mức phạt như quy định ở Điều 17.2 nêu trên, Bên vi phạm Hợp đồng có trách nhiệm bồi thường thiệt hại cho bên bị vi phạm do hành vi vi phạm Hợp đồng gây ra. Giá trị bồi thường thiệt hại bao gồm giá trị tổn thất thực tế, trực tiếp, có chứng từ chứng minh hợp lý mà Bên bị vi phạm phải chịu. Trừ khi Hợp đồng có quy định rõ khác bằng văn bản, VTIT không chịu trách nhiệm đối với các thiệt hại gián tiếp hoặc hệ quả phát sinh, bao gồm nhưng không giới hạn ở: mất dữ liệu,  mất  doanh  thu,  lợi  nhuận,  mất  cơ  hội  kinh  doanh,  gián  đoạn  hoạt  động  kinh doanh, thiệt hại tinh thần, các khoản trừng phạt hoặc các tổn thất tương tự khác.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "8.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7915, "content": "8.4. Trừ quy định tại khoản 9.5 Điều này, Bên bị ảnh hưởng và Bên không bị ảnh hưởng bởi Sự kiện Bất khả kháng sẽ không bị coi là vi phạm các quy định của\n\nHợp đồng hoặc chịu trách nhiệm đối với Bên còn lại do việc chậm trễ thực hiện các nghĩa vụ của mình (quy định này chỉ áp dụng đối với những nghĩa vụ không thể thực hiện được do ảnh hưởng của Sự kiện Bất khả kháng)."}, "chain": [{"number": "8.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "8.1. 'Sự kiện Bất khả kháng' là các sự kiện xảy ra một cách khách quan, không thể lường trước được và không thể khắc phục được làm ảnh hưởng tới việc thực hiện Hợp đồng mặc dù đã áp dụng mọi biện pháp cần thiết và khả năng cho phép của mỗi bên hoặc các bên. Sự kiện Bất khả kháng bao gồm nhưng không giới hạn thiên tai, hoả hoạn, lũ lụt, động đất, tai nạn, thảm họa, dịch bệnh, thay đổi quy định của pháp luật mà các bên không thể biết trước được vào thời điểm giao kết và thực hiện Hợp đồng và các Sự kiện Bất khả kháng khác nằm ngoài khả năng kiểm soát hợp lý của Các Bên.", "relation": "DEFINES", "children": []}, {"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "17.8", "title": "", "is_appendix": false, "matched": true, "score": 0.7852, "content": "17.8. Trong trường hợp tiến độ bàn giao, nghiệm thu bị chậm do Khách hàng không cung cấp kịp thời tài liệu, dữ liệu, môi trường kiểm thử, hoặc phản hồi theo quy định, thời hạn thực hiện tương ứng của VTIT sẽ được gia hạn tương ứng và không bị coi là vi phạm Hợp đồng."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được
