icate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}]}, {"root": {"number": "14.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7728, "content": "14.3. Giới hạn phạm vi\n\nTrừ khi Hợp đồng và các Phụ lục có quy định khác, phạm vi Dịch vụ không bao gồm: (i) cung cấp hạ tầng (máy chủ, đường truyền, thiết bị, bản quyền bên thứ ba); (ii) vận hành/điều hành hệ thống của Khách hàng; (iii) nhập liệu, làm sạch dữ liệu; (iv) tích hợp với hệ thống/đối tác bên thứ ba không nêu trong Phụ lục 01; (v) đào tạo, chuyển giao, bảo trì/mở rộng sau nghiệm thu; và/hoặc (vi) các công việc phát sinh theo yêu cầu không được xác nhận theo khoản 4 Điều này.\n\nTrong trường hợp Khách hàng có yêu cầu cung cấp các Dịch vụ nêu trên thì Các Bên sẽ thống nhất phạm vi và phí dịch vụ bằng văn bản trước khi thực hiện."}, "chain": []}, {"root": {"number": "10.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7685, "content": "10.1. Các Bên cam đoan và bảo đảm rằng:\n\na) Có đầy đủ năng lực pháp lý, tư cách pháp nhân và quyền ký kết và thực hiện Hợp đồng này theo quy định của pháp luật;\n\nb) Phần mềm, hệ thống là phù hợp với quy định của pháp luật hiện hành, không vi phạm bất kỳ quy định cấm nào, không bị cấm phát triển hoặc sử dụng theo pháp luật Việt Nam hoặc điều ước quốc tế có hiệu lực; việc xây dựng Phần mềm, hệ thống không làm phát sinh trách nhiệm pháp lý cho VTIT với tư cách là bên cung cấp dịch vụ.\n\nc) Phần mềm/hệ thống và/hoặc Dịch vụ theo Hợp đồng không được sử dụng, trực tiếp hoặc gián tiếp, cho bất kỳ mục đích nào liên quan đến khủng bố,\n\ntài trợ khủng bố, tội phạm xuyên quốc gia/tội phạm quốc tế, rửa tiền, buôn bán người, hoặc các hành vi bị cấm theo pháp luật Việt Nam và/hoặc các điều ước quốc tế có hiệu lực; Khách hàng cam kết bảo đảm việc sử dụng là hợp pháp và bồi thường, giữ cho VTIT không bị thiệt hại trước mọi khiếu nại, yêu cầu, chế tài phát sinh từ việc Khách hàng vi phạm cam kết này."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "5.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7684, "content": "5.1. VTIT cam kết không vi phạm bất kỳ quyền sở hữu trí tuệ nào của bên thứ ba hoặc sử dụng tài sản trí tuệ chưa được cấp phép hợp pháp trong quá trình cung cấp dịch vụ theo Hợp đồng này. Trường hợp có tranh chấp phát sinh liên quan đến quyền sở hữu trí tuệ do lỗi của VTIT, VTIT sẽ chịu trách nhiệm giải quyết các tranh chấp phát sinh (nếu có). Tuy nhiên, VTIT không chịu trách nhiệm đối với các nội dung, tài liệu, dữ liệu hoặc yêu cầu do Khách hàng cung cấp gây ra vi phạm."}, "chain": [{"number": "5.5", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.5. Quyền sở hữu trí tuệ của các Bên đối với Phần mềm được xác định như sau:\n\n## Mô hình 1: Client-owned IP (KH sở hữu sản phẩm bàn giao)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ (bao gồm quyền tác giả đối với chương trình máy tính, quyền liên quan và các quyền tài sản khác theo pháp luật) đối với các hạng mục  bàn giao/deliverables được tạo ra riêng cho Khách hàng trong quá trình thực hiện Dịch vụ ('Sản phẩm bàn giao') sẽ thuộc về Khách hàng.\n\n- b. Kể từ thời điểm nêu trên, VTIT chuyển giao cho Khách hàng các quyền tài sản tương ứng đối với Sản phẩm bàn giao trong phạm vi pháp luật cho phép; Khách hàng có quyền sử dụng, khai thác, sửa đổi, sao chép, phát triển theo mục đích quy định tại Hợp đồng này.\n\n- c. VTIT cam kết không tái sử dụng Sản phẩm bàn giao (toàn bộ hoặc phần cốt lõi mang tính đặc thù của Khách hàng) cho khách hàng khác, trừ (i) phần thuộc Tài sản có sẵn/Background IP của VTIT; và/hoặc (ii) các thành phần mã nguồn mở/được cấp phép hợp pháp.\n\n## Mô hình 2: Vendor-owned IP (VTIT sở hữu bản quyền)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ đối với Sản phẩm bàn giao (bao gồm mọi cải tiến/phát triển phát sinh trong quá trình thực hiện Dịch vụ) sẽ thuộc về VTIT.\n\n- b. VTIT cấp cho Khách hàng một giấy phép sử dụng Sản phẩm bàn giao trọn đời, không độc quyền, không chuyển nhượng, không được cấp lại nếu không có chấp thuận bằng văn bản của VTIT, trong phạm vi mục đích sử dụng theo Hợp đồng/Phụ lục.\n\n- c. Khách hàng không được (và không được cho  phép bên khác) thực hiện reverse  engineering  (phân  tích  ngược/dịch  ngược),  decompile  (giải  biên dịch), disassemble (tháo rời/dịch ngược sang mã máy/assembly), tách/chiết mã nguồn, hoặc tạo sản phẩm phái sinh nhằm thương mại hóa/phân phối lại Sản phẩm bàn giao, trừ khi pháp luật bắt buộc. VTIT được quyền tái sử dụng,  cung  cấp  cho  khách  hàng  khác  các  thành  phần  chung/khung  kỹ thuật/know-how, với điều kiện không tiết lộ Thông tin mật của Khách hàng.\n\n## Mô hình 3 - Pre-existing IP (Background IP gixisting IP tạo sản phẩm phái sinh\n\n- a. 'Background IP' là toàn bộ mã nguồn, công cụ, thư viện, framework, tài liệu, quy trình, bí quyết kỹ thuật, nền tảng phần mềm và/hoặc các thành phần khác mà VTIT (hoặc bên cấp phép hợp pháp cho VTIT) đã sở hữu/có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập, không phụ thuộc vào dự án. Background IP thuộc sở hữu của VTIT (hoặc chủ thể có quyền), và không chuyển giao cho Khách hàng theo Hợp đồng này.\n\n- b. 'Project IP' là các hạng mục được phát triển riêng theo yêu cầu của Khách hàng  trong  phạm  vi  Dịch  vụ  (ví  dụ:  chức  năng,  luồng  nghiệp  vụ,  cấu hình/tùy  biến,  tài  liệu  đặc  thù,  mã  nguồn  custom  nếu  có).  Trừ  khi  Hợp đồng/Phụ lục quy định khác, Project IP sẽ thuộc về Khách hàng.\n\n- c. Trong phạm vi cần thiết để Khách hàng khai thác Project IP/Sản phẩm bàn giao, VTIT cấp cho Khách hàng giấy phép sử dụng Background IP trọn đời, không độc quyền, không chuyển nhượng, chỉ để vận hành/khai thác Sản phẩm bàn giao theo Hợp đồng.\n\n## Mô hình 4 - Đồng sở hữu; cả hai Bên được khai thác thương mại; VTIT độc quyền quyền đăng ký/đứng tên\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, các hạng mục/deliverables được tạo ra trong quá trình thực hiện Dịch vụ theo Hợp đồng ('Sản phẩm') là tài sản đồng sở hữu của VTIT và Khách hàng đối với phần quyền tài sản theo pháp luật về sở hữu trí tuệ, kể từ thời điểm Khách hàng hoàn tất thanh toán đầy đủ mọi khoản đến hạn theo Hợp đồng.\n\n- b. Quyền khai thác của các Bên: Mỗi Bên có quyền độc lập khai thác thương mại Sản phẩm (bao gồm phát triển, nâng cấp, phân phối, chuyển giao/cấp phép quyền sử dụng, cung cấp dưới dạng dịch vụ, cho thuê hoặc hình thức thương mại hợp pháp khác) cho bên thứ ba mà không phải xin chấp thuận của Bên còn lại, với điều kiện: (i) không tiết lộ Thông tin mật của Bên còn lại; (ii) không sử dụng dữ liệu, nhãn hiệu, tên thương mại, dấu hiệu nhận diện và/hoặc các tài sản riêng của Bên còn lại nếu không có chấp thuận bằng  văn  bản;  và  (iii)  tuân  thủ  các  nghĩa  vụ/bảo  lưu  quyền  đối  với Background IP và/hoặc mã nguồn mở (OSS) (nếu có).\n\n- c. Quyền đăng ký và đứng tên: VTIT là bên duy nhất có quyền nộp đơn, thực hiện thủ tục đăng ký (và đứng tên trên Giấy chứng nhận, nếu được cấp) đối với quyền tác giả/chương trình máy tính và/hoặc quyền sở hữu trí tuệ liên quan đến Sản phẩm. Việc VTIT đứng tên đăng ký không làm thay đổi bản chất đồng sở hữu và quyền khai thác của Khách hàng theo khoản 1 và khoản 2 Điều này.\n\n- d. Bảo lưu Background IP và OSS: Mọi tài sản có sẵn/Background IP của mỗi Bên và/hoặc các thành phần mã nguồn mở (OSS) được sử dụng trong Sản phẩm (nếu có) vẫn thuộc chủ sở hữu tương ứng và/hoặc tuân theo điều kiện giấy phép áp dụng; điều khoản đồng sở hữu tại Điều này không được hiểu là chuyển giao quyền sở hữu đối với Background IP/OSS.\n\nCác Bên lựa chọn Mô hình 1 để điều chỉnh quyền sở hữu trí tuệ trong Hợp đồng này.", "relation": "REFERS_TO", "children": [{"number": "5.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.2. Sau khi VTIT hoàn thành việc bàn giao kết quả công việc cho Khách hàng và Khách hàng đã thanh toán đầy đủ cho VTIT theo quy định tại Hợp đồng, Khách hàng sẽ nhận được đầy đủ quyền sở hữu trí tuệ theo quy định tại khoản 5.6 Điều này.", "relation": "REFERS_TO", "children": []}, {"number": "5.3", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.3. VTIT có quyền sử dụng lại các thành phần, công cụ, thư viện, đoạn mã được phát triển sẵn hoặc không mang tính đặc thù cho Khách hàng trong các dự án\n\nkhác, với điều kiện không tiết lộ thông tin bảo mật hoặc vi phạm quyền sở hữu trí tuệ của Khách hàng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"number": "5.4", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.4. Trong quá trình cung cấp Dịch vụ và/hoặc phát triển Sản phẩm bàn giao, VTIT có thể sử dụng một số thành phần phần mềm mã nguồn mở (Open Source Software - OSS) được cấp phép hợp pháp theo các giấy phép mã nguồn mở tương ứng. Việc sử dụng các thành phần OSS này phải tuân thủ đầy đủ các điều kiện của giấy phép OSS áp dụng. Các thành phần OSS (nếu có) không thuộc quyền sở hữu của VTIT và không được chuyển giao quyền sở hữu theo Hợp đồng này; việc sử dụng, khai thác và phân phối các thành phần OSS sẽ tuân theo các điều kiện cấp phép của chủ sở hữu OSS tương ứng.", "relation": "REFERS_TO", "children": []}]}]}, {"root": {"number": "16.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7675, "content": "16.1. Thời gian cung cấp dịch vụ: 365 ngày kể từ Ngày hợp đồng có hiệu lực.\n\nThời gian cung cấp dịch vụ có thể kết thúc sớm hoặc muộn hơn theo thỏa thuận của Các Bên, đảm bảo VTIT đã thực hiện đúng khối lượng theo thỏa thuận của Các Bên."}, "chain": []}, {"root": {"number": "15.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7644, "content": "15.1. Giá trị hợp đồng:\n\na) Tổng giá trị hợp đồng dự kiến: 10.000.000.0000 VNĐ\n\n(Bằng chữ: Mười tỷ đồng\n\n./.)\n\nChi tiết giá Dịch vụ cụ thể như sau: |   STT | Dịch vụ               |   Khối lượng (MM) | Đơn giá (VNĐ)   | Thành tiền (VNĐ)   |\n\n|-------|-----------------------|-------------------|-----------------|--------------------|\n\n|     1 | Phát triển phần mềm A |               700 | 10.000.000      | 7.000.000.000      |\n\n|     2 | Phát triển phần mềm B |               300 | 10.000.000      | 3.000.000.000      |\n\n|       | Thuế GTGT             |                 0 | 0               | 0                  |\n\n|       | Tổng cộng             |              1000 |                 | 10.000.000.000     |\n\nb) Dịch vụ phát triển phần mềm là đối tượng không chịu thuế GTGT theo quy định pháp luật hiện hành tại thời điểm ký kết Hợp đồng. Trường hợp có phát sinh nghĩa vụ nộp thuế GTGT đối với Dịch vụ thì Khách hàng có trách nhiệm thanh toán phần thuế GTGT phát sinh bổ sung này cho VTIT hoặc nộp trực tiếp cho cơ quan nhà nước có thẩm quyền, trong thời hạn được ghi nhận tại thông báo của VTIT hoặc cơ quan nhà nước.\n\nc) Khách hàng thanh toán giá trị nghiệm thu thực tế cho VTIT."}, "chain": []}, {"root": {"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": true, "score": 0.7623, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật."}, "chain": [{"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các m) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}, {"root": {"number": "2.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7614, "content": "2.2. Các Phụ lục đính kèm Hợp đồng;"}, "chain": []}, {"root": {"number": "2.1", "title": "", "is_appendix": false, "matched": true, "score": 0.751, "content": "Thành phần Hợp đồng và thứ tự ưu tiên pháp lý như sau :\n\n2.1. Văn bản Hợp đồng;"}, "chain": []}, {"root": {"number": "16.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7507, "content": "16.3. Trường hợp việc thay đổi thời gian cung cấp dịch vụ dẫn đến phát sinh chi phí bổ sung (bao gồm nhưng không giới hạn chi phí nhân sự, vận hành, tổ chức lại kế hoạch triển khai và các chi phí có liên quan khác để phục vụ việc cung cấp dịch vụ), VTIT có quyền đề xuất điều chỉnh giá trị Hợp đồng tương ứng với phần phát sinh, căn cứ theo tài liệu, kế hoạch triển khai thực tế và sự chấp thuận của Khách hàng."}, "chain": []}]}, {"item_id": "CL-14", "category": "Khả thi cam kết dịch vụ", "question": "Các cam kết với khách hàng về bảo mật, hỗ trợ vận hành, nhân sự hoặc thời gian phản hồi có khả thi không?", "status": "fail", "evidence": "Điều 6 (Bảo mật thông tin và bảo vệ dữ liệu cá nhân): 6.1-6.5. Điều 10 (Cam đoan và bảo đảm): 10.1(c) và 10.3(a). Điều 4 (Quyền và nghĩa vụ của VTIT): 4.2(b), 4.2(d), 4.2(f). Điều 16 (Thời gian cung cấp dịch vụ): 16.3. Điều 14 (Phạm vi dịch vụ và chỉ tiêu kỹ thuật): 14.1, 14.3. Điều 18 (Bảo hành): 18.3-18.4. Điều 12 (Chấm dứt): 12.2. Điều 7 (Quan hệ lao động): 7.2-7.4. Các điều khoản được cung cấp chưa có nội dung “24/7/ngoài giờ” hoặc danh sách nhân sự/ca trực/thông số hạ tầng.", "reasoning": "Hợp đồng có cam kết bảo mật và có mốc thời gian phản hồi đối với yêu cầu bảo hành, nhưng phần điều khoản được cung cấp không có các bằng chứng trực tiếp về cam kết hỗ trợ vận hành, cam kết nhân sự cụ thể/ca trực/hạ tầng để kiểm tra tính khả thi, cũng như không có chỉ định nhân sự chủ chốt và quy trình thay thế. Đồng thời chưa thấy điều khoản giới hạn trách nhiệm theo giá trị hợp đồng trong các điều khoản được cung cấp.", "recommendation": "Bổ sung/hoàn thiện (trong phạm vi phần điều khoản còn thiếu) các nội dung: (i) phạm vi hỗ trợ vận hành (nếu có) và quy định về thời gian phản hồi/giới hạn số lần; (ii) danh sách nhân sự chủ chốt và cơ chế thay thế (tiêu chuẩn tương đương, thời gian thông báo/chấp thuận); (iii) mô tả năng lực/hạ tầng/ca trực đủ để bảo đảm các cam kết; (iv) điều khoản giới hạn trách nhiệm/bồi thường theo giá trị hợp đồng hoặc cơ chế tính giới hạn tương ứng.", "evidences": [{"root": {"number": "6.1", "title": "", "is_appendix": false, "matched": true, "score": 0.8436, "content": "6.1. Các Bên cam kết giữ bí mật tất cả các thông tin, báo cáo, tài liệu, dữ liệu có được từ Bên kia theo Hợp đồng. Không có sự đồng ý trước bằng văn bản của Bên cung cấp thông tin, Bên nhận thông tin không được tiết lộ bất kì thông tin, báo cáo, tài liệu và dữ liệu của Bên cung cấp thông tin cho Bên thứ ba. Các Bên cam kết tiến hành các  biện pháp bảo mật và các hoạt động dự phòng cần thiết và phù hợp để đảm bảo giữ bí mật những thông tin trên và đảm bảo những thông tin này không bị sử dụng sai mục đích trong quá trình thực hiện và sau khi kết thúc Hợp đồng."}, "chain": []}, {"root": {"number": "10.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8199, "content": "10.2. Khách hàng cam đoan và bảo đảm rằng:\n\na) Có đầy đủ quyền sử dụng hợp pháp các tài sản, dữ liệu, thông tin cung cấp cho VTIT theo Hợp đồng này;\n\nb) Thông tin, tài liệu, yêu cầu kỹ thuật, nghiệp vụ do Khách hàng cung cấp là chính xác, hợp pháp và không vi phạm quyền của bên thứ ba;\n\nc) Việc ký kết và thực hiện Hợp đồng này không vi phạm bất kỳ nghĩa vụ hợp đồng nào hoặc quy định pháp luật nào mà Khách hàng bị ràng buộc."}, "chain": []}, {"root": {"number": "15.1", "title": "", "is_appendix": false, "matched": true, "score": 0.8181, "content": "15.1. Giá trị hợp đồng:\n\na) Tổng giá trị hợp đồng dự kiến: 10.000.000.0000 VNĐ\n\n(Bằng chữ: Mười tỷ đồng\n\n./.)\n\nChi tiết giá Dịch vụ cụ thể như sau: |   STT | Dịch vụ               |   Khối lượng (MM) | Đơn giá (VNĐ)   | Thành tiền (VNĐ)   |\n\n|-------|-----------------------|-------------------|-----------------|--------------------|\n\n|     1 | Phát triển phần mềm A |               700 | 10.000.000      | 7.000.000.000      |\n\n|     2 | Phát triển phần mềm B |               300 | 10.000.000      | 3.000.000.000      |\n\n|       | Thuế GTGT             |                 0 | 0               | 0                  |\n\n|       | Tổng cộng             |              1000 |                 | 10.000.000.000     |\n\nb) Dịch vụ phát triển phần mềm là đối tượng không chịu thuế GTGT theo quy định pháp luật hiện hành tại thời điểm ký kết Hợp đồng. Trường hợp có phát sinh nghĩa vụ nộp thuế GTGT đối với Dịch vụ thì Khách hàng có trách nhiệm thanh toán phần thuế GTGT phát sinh bổ sung này cho VTIT hoặc nộp trực tiếp cho cơ quan nhà nước có thẩm quyền, trong thời hạn được ghi nhận tại thông báo của VTIT hoặc cơ quan nhà nước.\n\nc) Khách hàng thanh toán giá trị nghiệm thu thực tế cho VTIT."}, "chain": []}, {"root": {"number": "18.4", "title": "", "is_appendix": false, "matched": true, "score": 0.8118, "content": "18.4. Khi phương án xử lý được Khách hàng chấp thuận, VTIT sẽ triển khai việc khắc phục trong thời hạn tối đa [12] giờ làm việc đối với lỗi mức độ nghiêm trọng hoặc theo thời gian thống nhất giữa hai Bên nếu lỗi có tính chất phức tạp hoặc phụ thuộc yếu tố hạ tầng/vận hành của Khách hàng."}, "chain": []}, {"root": {"number": "18.3", "title": "", "is_appendix": false, "matched": true, "score": 0.8079, "content": "18.3. Sau khi nhận được yêu cầu bảo hành chính thức bằng văn bản hoặc qua điện thoại/email từ Khách hàng, VTIT có trách nhiệm phản hồi trong vòng [12] giờ làm việc kể từ thời điểm nhận được yêu cầu và cử cán bộ kỹ thuật đánh giá lỗi để đề xuất phương án xử lý trong thời hạn hợp lý, tùy theo tính chất lỗi."}, "chain": []}, {"root": {"number": "7.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8059, "content": "7.2. Trong thời gian thực hiện Hợp đồng và trong vòng 12 tháng kể từ ngày Hợp đồng chấm dứt hoặc hết hạn vì bất kỳ lý do nào, Khách hàng cam kết:\n\na) Không trực tiếp hoặc gián tiếp tuyển dụng, thuê, mời làm việc, lôi kéo hoặc khuyến khích bất kỳ nhân sự nào (bao gồm cán bộ, nhân viên, thực tập sinh, cộng tác viên và các nhân sự khác) của VTIT mà Khách hàng đã biết hoặc tiếp xúc trong quá trình thực hiện Hợp đồng;\n\nb) Không đề nghị, khuyến khích hoặc hỗ trợ bất kỳ nhân sự nào của VTIT chấm dứt hợp đồng lao động, hợp tác hoặc quan hệ làm việc với VTIT."}, "chain": []}, {"root": {"number": "10.3", "title": "", "is_appendix": false, "matched": true, "score": 0.8043, "content": "10.3. VTIT cam đoan và bảo đảm rằng: - a) Có đầy đủ năng lực kỹ thuật, kinh nghiệm và nguồn lực cần thiết để thực hiện đúng và đầy đủ các nghĩa vụ đã cam kết trong Hợp đồng;\n\nb) Trong quá trình thực hiện Hợp đồng, sẽ không vi quyền sở hữu trí tuệ của bên thứ ba;\n\nc) Dịch vụ và sản phẩm bàn giao theo Hợp đồng sẽ đáp ứng các yêu cầu kỹ thuật, chức năng như đã thỏa thuận tại Hợp đồng và các Phụ lục kèm theo."}, "chain": []}, {"root": {"number": "4.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8012, "content": "4.2. Nghĩa vụ của VTIT:\n\na) Cung cấp dịch vụ phần mềm cho Khách hàng theo đúng nội dung, phạm vi và tiêu chuẩn kỹ thuật được quy định tại Hợp đồng, Phiếu giao công việc, Danh sách công việc hoặc các tài liệu giao việc khác đã được Các Bên thống nhất bằng văn bản;\n\nb) Có trách nhiệm tiếp nhận kế hoạch công việc và xây dựng kế hoạch triển khai, bàn giao phù hợp theo thỏa thuận của Các Bên. Kế hoạch công việc phải được xác nhận bằng văn bản giữa Các Bên trước khi triển khai;\n\nc) Chịu trách nhiệm bảo quản, giữ gìn và sử dụng đúng mục đích các hệ thống, thiết bị, cơ sở vật chất mà Khách hàng đã bàn giao phục vụ cho việc thực hiện dịch vụ theo Hợp đồng (nếu có);\n\nd) Thực hiện đầy đủ và đúng tiến độ các công việc được giao theo kế hoạch, đảm bảo tuân thủ yêu cầu kỹ thuật, chất lượng sản phẩm và bàn giao đầy đủ các tài liệu, sản phẩm liên quan theo đúng quy định trong Hợp đồng.\n\ne) Tuân thủ các yêu cầu, hướng dẫn nghiệp vụ của Khách hàng trong phạm vi  Dịch  vụ  và  phù  hợp  với  Hợp  đồng/Phụ  lục,  với  điều  kiện  các  yêu cầu/hướng dẫn đó không làm thay đổi phạm vi, tiêu chuẩn kỹ thuật, tiến độ hoặc chi phí đã thỏa thuận;\n\nf) Cung cấp đầy đủ, kịp thời các hồ sơ, tài liệu, biên bản, báo cáo liên quan phục vụ công tác nghiệm thu và thanh toán theo quy định tại Hợp đồng.\n\n7. 4.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật."}, "chain": [{"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": true, "score": 0.7927, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật.", "relation": "REFERS_TO", "children": [{"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}]}, {"root": {"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": true, "score": 0.7927, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật."}, "chain": [{"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}, {"root": {"number": "16.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7908, "content": "16.3. Trường hợp việc thay đổi thời gian cung cấp dịch vụ dẫn đến phát sinh chi phí bổ sung (bao gồm nhưng không giới hạn chi phí nhân sự, vận hành, tổ chức lại kế hoạch triển khai và các chi phí có liên quan khác để phục vụ việc cung cấp dịch vụ), VTIT có quyền đề xuất điều chỉnh giá trị Hợp đồng tương ứng với phần phát sinh, căn cứ theo tài liệu, kế hoạch triển khai thực tế và sự chấp thuận của Khách hàng."}, "chain": []}, {"root": {"number": "14.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7839, "content": "14.3. Giới hạn phạm vi\n\nTrừ khi Hợp đồng và các Phụ lục có quy định khác, phạm vi Dịch vụ không bao gồm: (i) cung cấp hạ tầng (máy chủ, đường truyền, thiết bị, bản quyền bên thứ ba); (ii) vận hành/điều hành hệ thống của Khách hàng; (iii) nhập liệu, làm sạch dữ liệu; (iv) tích hợp với hệ thống/đối tác bên thứ ba không nêu trong Phụ lục 01; (v) đào tạo, chuyển giao, bảo trì/mở rộng sau nghiệm thu; và/hoặc (vi) các công việc phát sinh theo yêu cầu không được xác nhận theo khoản 4 Điều này.\n\nTrong trường hợp Khách hàng có yêu cầu cung cấp các Dịch vụ nêu trên thì Các Bên sẽ thống nhất phạm vi và phí dịch vụ bằng văn bản trước khi thực hiện."}, "chain": []}, {"root": {"number": "12.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7839, "content": "12.4. Trường hợp Hợp đồng bị chấm dứt trước thời hạn mà không phải do lỗi của VTIT, VTIT vẫn có quyền:\n\na) Yêu cầu thanh toán đầy đủ cho phần công việc đã thực hiện và  được nghiệm thu tính đến thời điểm chấm dứt;\n\nb) Yêu cầu thanh toán các chi phí hợp lý đã phát sinh đối với phần công việc đang thực hiện dở dang (nếu có), trên cơ sở tài liệu, chứng từ hợp lệ được Khách hàng xác nhận;\n\nc) Không bị coi là vi phạm Hợp đồng hoặc chịu phạt vi phạm do việc chấm dứt không thuộc lỗi của mình."}, "chain": []}, {"root": {"number": "7.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7822, "content": "7.3. Trường hợp Khách hàng có nhu cầu tuyển dụng hoặc hợp tác với nhân sự của VTIT trong thời hạn cam kết, Khách hàng phải có được sự chấp thuận bằng văn bản của VTIT."}, "chain": []}, {"root": {"number": "19.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7785, "content": "19.2. Hợp đồng có tính ràng buộc và có hiệu lực pháp luật đối với Các Bên cũng như các tổ chức kế thừa quyền lợi và trách nhiệm của Các Bên theo Hợp đồng."}, "chain": []}, {"root": {"number": "10.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7735, "content": "10.1. Các Bên cam đoan và bảo đảm rằng:\n\na) Có đầy đủ năng lực pháp lý, tư cách pháp nhân và quyền ký kết và thực hiện Hợp đồng này theo quy định của pháp luật;\n\nb) Phần mềm, hệ thống là phù hợp với quy định của pháp luật hiện hành, không vi phạm bất kỳ quy định cấm nào, không bị cấm phát triển hoặc sử dụng theo pháp luật Việt Nam hoặc điều ước quốc tế có hiệu lực; việc xây dựng Phần mềm, hệ thống không làm phát sinh trách nhiệm pháp lý cho VTIT với tư cách là bên cung cấp dịch vụ.\n\nc) Phần mềm/hệ thống và/hoặc Dịch vụ theo Hợp đồng không được sử dụng, trực tiếp hoặc gián tiếp, cho bất kỳ mục đích nào liên quan đến khủng bố,\n\ntài trợ khủng bố, tội phạm xuyên quốc gia/tội phạm quốc tế, rửa tiền, buôn bán người, hoặc các hành vi bị cấm theo pháp luật Việt Nam và/hoặc các điều ước quốc tế có hiệu lực; Khách hàng cam kết bảo đảm việc sử dụng là hợp pháp và bồi thường, giữ cho VTIT không bị thiệt hại trước mọi khiếu nại, yêu cầu, chế tài phát sinh từ việc Khách hàng vi phạm cam kết này."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "6.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7725, "content": "6.4. Ngoài quy định tại Điều này, Các Bên cam kết tuyệt đối tuân thủ các quy định bảo mật chung như Phụ lục 02 của Hợp đồng này."}, "chain": [{"number": "6.1", "title": "", "is_appendix": false, "matched": true, "score": 0.8436, "content": "6.1. Các Bên cam kết giữ bí mật tất cả các thông tin, báo cáo, tài liệu, dữ liệu có được từ Bên kia theo Hợp đồng. Không có sự đồng ý trước bằng văn bản của Bên cung cấp thông tin, Bên nhận thông tin không được tiết lộ bất kì thông tin, báo cáo, tài liệu và dữ liệu của Bên cung cấp thông tin cho Bên thứ ba. Các Bên cam kết tiến hành các  biện pháp bảo mật và các hoạt động dự phòng cần thiết và phù hợp để đảm bảo giữ bí mật những thông tin trên và đảm bảo những thông tin này không bị sử dụng sai mục đích trong quá trình thực hiện và sau khi kết thúc Hợp đồng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "5.5", "title": "", "is_appendix": false, "matched": true, "score": 0.7705, "content": "5.5. Quyền sở hữu trí tuệ của các Bên đối với Phần mềm được xác định như sau:\n\n## Mô hình 1: Client-owned IP (KH sở hữu sản phẩm bàn giao)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ (bao gồm quyền tác giả đối với chương trình máy tính, quyền liên quan và các quyền tài sản khác theo pháp luật) đối với các hạng mục  bàn giao/deliverables được tạo ra riêng cho Khách hàng trong quá trình thực hiện Dịch vụ ('Sản phẩm bàn giao') sẽ thuộc về Khách hàng.\n\n- b. Kể từ thời điểm nêu trên, VTIT chuyển giao cho Khách hàng các quyền tài sản tương ứng đối với Sản phẩm bàn giao trong phạm vi pháp luật cho phép; Khách hàng có quyền sử dụng, khai thác, sửa đổi, sao chép, phát triển theo mục đích quy định tại Hợp đồng này.\n\n- c. VTIT cam kết không tái sử dụng Sản phẩm bàn giao (toàn bộ hoặc phần cốt lõi mang tính đặc thù của Khách hàng) cho khách hàng khác, trừ (i) phần thuộc Tài sản có sẵn/Background IP của VTIT; và/hoặc (ii) các thành phần mã nguồn mở/được cấp phép hợp pháp.\n\n## Mô hình 2: Vendor-owned IP (VTIT sở hữu bản quyền)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ đối với Sản phẩm bàn giao (bao gồm mọi cải tiến/phát triển phát sinh trong quá trình thực hiện Dịch vụ) sẽ thuộc về VTIT.\n\n- b. VTIT cấp cho Khách hàng một giấy phép sử dụng Sản phẩm bàn giao trọn đời, không độc quyền, không chuyển nhượng, không được cấp lại nếu không có chấp thuận bằng văn bản của VTIT, trong phạm vi mục đích sử dụng theo Hợp đồng/Phụ lục.\n\n- c. Khách hàng không được (và không được cho  phép bên khác) thực hiện reverse  engineering  (phân  tích  ngược/dịch  ngược),  decompile  (giải  biên dịch), disassemble (tháo rời/dịch ngược sang mã máy/assembly), tách/chiết mã nguồn, hoặc tạo sản phẩm phái sinh nhằm thương mại hóa/phân phối lại Sản phẩm bàn giao, trừ khi pháp luật bắt buộc. VTIT được quyền tái sử dụng,  cung  cấp  cho  khách  hàng  khác  các  thành  phần  chung/khung  kỹ thuật/know-how, với điều kiện không tiết lộ Thông tin mật của Khách hàng.\n\n## Mô hình 3 - Pre-existing IP (Background IP gixisting IP tạo sản phẩm phái sinh\n\n- a. 'Background IP' là toàn bộ mã nguồn, công cụ, thư viện, framework, tài liệu, quy trình, bí quyết kỹ thuật, nền tảng phần mềm và/hoặc các thành phần khác mà VTIT (hoặc bên cấp phép hợp pháp cho VTIT) đã sở hữu/có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập, không phụ thuộc vào dự án. Background IP thuộc sở hữu của VTIT (hoặc chủ thể có quyền), và không chuyển giao cho Khách hàng theo Hợp đồng này.\n\n- b. 'Project IP' là các hạng mục được phát triển riêng theo yêu cầu của Khách hàng  trong  phạm  vi  Dịch  vụ  (ví  dụ:  chức  năng,  luồng  nghiệp  vụ,  cấu hình/tùy  biến,  tài  liệu  đặc  thù,  mã  nguồn  custom  nếu  có).  Trừ  khi  Hợp đồng/Phụ lục quy định khác, Project IP sẽ thuộc về Khách hàng.\n\n- c. Trong phạm vi cần thiết để Khách hàng khai thác Project IP/Sản phẩm bàn giao, VTIT cấp cho Khách hàng giấy phép sử dụng Background IP trọn đời, không độc quyền, không chuyển nhượng, chỉ để vận hành/khai thác Sản phẩm bàn giao theo Hợp đồng.\n\n## Mô hình 4 - Đồng sở hữu; cả hai Bên được khai thác thương mại; VTIT độc quyền quyền đăng ký/đứng tên\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, các hạng mục/deliverables được tạo ra trong quá trình thực hiện Dịch vụ theo Hợp đồng ('Sản phẩm') là tài sản đồng sở hữu của VTIT và Khách hàng đối với phần quyền tài sản theo pháp luật về sở hữu trí tuệ, kể từ thời điểm Khách hàng hoàn tất thanh toán đầy đủ mọi khoản đến hạn theo Hợp đồng.\n\n- b. Quyền khai thác của các Bên: Mỗi Bên có quyền độc lập khai thác thương mại Sản phẩm (bao gồm phát triển, nâng cấp, phân phối, chuyển giao/cấp phép quyền sử dụng, cung cấp dưới dạng dịch vụ, cho thuê hoặc hình thức thương mại hợp pháp khác) cho bên thứ ba mà không phải xin chấp thuận của Bên còn lại, với điều kiện: (i) không tiết lộ Thông tin mật của Bên còn lại; (ii) không sử dụng dữ liệu, nhãn hiệu, tên thương mại, dấu hiệu nhận diện và/hoặc các tài sản riêng của Bên còn lại nếu không có chấp thuận bằng  văn  bản;  và  (iii)  tuân  thủ  các  nghĩa  vụ/bảo  lưu  quyền  đối  với Background IP và/hoặc mã nguồn mở (OSS) (nếu có).\n\n- c. Quyền đăng ký và đứng tên: VTIT là bên duy nhất có quyền nộp đơn, thực hiện thủ tục đăng ký (và đứng tên trên Giấy chứng nhận, nếu được cấp) đối với quyền tác giả/chương trình máy tính và/hoặc quyền sở hữu trí tuệ liên quan đến Sản phẩm. Việc VTIT đứng tên đăng ký không làm thay đổi bản chất đồng sở hữu và quyền khai thác của Khách hàng theo khoản 1 và khoản 2 Điều này.\n\n- d. Bảo lưu Background IP và OSS: Mọi tài sản có sẵn/Background IP của mỗi Bên và/hoặc các thành phần mã nguồn mở (OSS) được sử dụng trong Sản phẩm (nếu có) vẫn thuộc chủ sở hữu tương ứng và/hoặc tuân theo điều kiện giấy phép áp dụng; điều khoản đồng sở hữu tại Điều này không được hiểu là chuyển giao quyền sở hữu đối với Background IP/OSS.\n\nCác Bên lựa chọn Mô hình 1 để điều chỉnh quyền sở hữu trí tuệ trong Hợp đồng này."}, "chain": [{"number": "5.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.2. Sau khi VTIT hoàn thành việc bàn giao kết quả công việc cho Khách hàng và Khách hàng đã thanh toán đầy đủ cho VTIT theo quy định tại Hợp đồng, Khách hàng sẽ nhận được đầy đủ quyền sở hữu trí tuệ theo quy định tại khoản 5.6 Điều này.", "relation": "REFERS_TO", "children": [{"number": "5.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.1. VTIT cam kết không vi phạm bất kỳ quyền sở hữu trí tuệ nào của bên thứ ba hoặc sử dụng tài sản trí tuệ chưa được cấp phép hợp pháp trong quá trình cung cấp dịch vụ theo Hợp đồng này. Trường hợp có tranh chấp phát sinh liên quan đến quyền sở hữu trí tuệ do lỗi của VTIT, VTIT sẽ chịu trách nhiệm giải quyết các tranh chấp phát sinh (nếu có). Tuy nhiên, VTIT không chịu trách nhiệm đối với các nội dung, tài liệu, dữ liệu hoặc yêu cầu do Khách hàng cung cấp gây ra vi phạm.", "relation": "REFERS_TO", "children": []}]}, {"number": "5.3", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.3. VTIT có quyền sử dụng lại các thành phần, công cụ, thư viện, đoạn mã được phát triển sẵn hoặc không mang tính đặc thù cho Khách hàng trong các dự án\n\nkhác, với điều kiện không tiết lộ thông tin bảo mật hoặc vi phạm quyền sở hữu trí tuệ của Khách hàng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"number": "5.4", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.4. Trong quá trình cung cấp Dịch vụ và/hoặc phát triển Sản phẩm bàn giao, VTIT có thể sử dụng một số thành phần phần mềm mã nguồn mở (Open Source Software - OSS) được cấp phép hợp pháp theo các giấy phép mã nguồn mở tương ứng. Việc sử dụng các thành phần OSS này phải tuân thủ đầy đủ các điều kiện của giấy phép OSS áp dụng. Các thành phần OSS (nếu có) không thuộc quyền sở hữu của VTIT và không được chuyển giao quyền sở hữu theo Hợp đồng này; việc sử dụng, khai thác và phân phối các thành phần OSS sẽ tuân theo các điều kiện cấp phép của chủ sở hữu OSS tương ứng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "2.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7642, "content": "Thành phần Hợp đồng và thứ tự ưu tiên pháp lý như sau :\n\n2.1. Văn bản Hợp đồng;"}, "chain": []}, {"root": {"number": "13.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7602, "content": "13.2. Mọi tranh chấp phát sinh từ hoặc liên quan đến Hợp đồng sẽ được giải quyết thông qua thương lượng giữa Các Bên."}, "chain": []}, {"root": {"number": "13.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7529, "content": "13.1. Hợp đồng được điều chỉnh và giải thích theo pháp luật Việt Nam."}, "chain": []}]}, {"item_id": "CL-15", "category": "Phạm vi và nghiệm thu", "question": "Phạm vi công việc, deliverables, tiêu chí nghiệm thu và timeline có đủ rõ ràng không?", "status": "fail", "evidence": "- Điều 17.2: “Trong thời hạn 03 (ba) ngày làm việc kể từ khi kết thúc kiểm thử, Khách hàng có trách nhiệm xác nhận kết quả bằng văn bản và Hai Bên sẽ ký Biên bản nghiệm thu sơ bộ (PAC).”\n- Điều 17.3: “Kể từ ngày ký PAC, VTIT tiến hành chạy thử phần mềm … trong thời gian tối đa 5 (năm) ngày làm việc … Nếu phần mềm hoạt động ổn định, đáp ứng yêu cầu kỹ thuật và nghiệp vụ thì … ký Biên bản nghiệm thu tổng thể (FAC) trong thời hạn 03 (ba) ngày làm việc kể từ ngày kết thúc chạy thử.”\n- Điều 17.4: “Nếu trong quá trình nghiệm thu, kết quả công việc không đáp ứng yêu cầu Hợp đồng thì Khách hàng có quyền yêu cầu VTIT khắc phục và chỉnh sửa… trong vòng 03 (ba) ngày làm việc kể từ ngày nhận bàn giao hoặc hoàn tất kiểm thử.”\n- Điều 17.7: “Trường hợp chỉ một phần kết quả công việc không đạt yêu cầu, Khách hàng có trách nhiệm nghiệm thu các phần còn lại… và chỉ yêu cầu VTIT sửa đổi đối với phần chưa đạt yêu cầu. Việc thanh toán được thực hiện đối với phần công việc đã được nghiệm thu.”\n- Điều 17.9: “VTIT có quyền đề xuất chi phí phát sinh hợp lý cho các lần kiểm thử lại này, trên cơ sở tài liệu chứng minh và sự xác nhận của Khách hàng.”\n- Điều 14.1-14.2: “Các chỉ tiêu kỹ thuật… tiêu chí nghiệm thu và phương pháp kiểm thử (nếu có) … được dẫn chiếu và quy định chi tiết tại Phụ lục 01…”; “Trường hợp có khác biệt… Phụ lục 02 được ưu tiên áp dụng…”\n- Điều 15.3: “Thanh toán lần 1 - Sau khi ký Biên bản bàn giao phần mềm (HOC)… Thanh toán lần 2 - Sau khi ký Biên bản nghiệm thu tổng thể (FAC)… ”", "reasoning": "Hợp đồng có quy trình nghiệm thu với các mốc thời hạn cụ thể (PAC và FAC), đồng thời có cơ chế xử lý khi kết quả không đáp ứng yêu cầu và gắn thanh toán với nghiệm thu từng phần. Tuy nhiên, phần điều khoản được truy hồi chưa thể hiện deliverables cụ thể/định lượng cũng như tiêu chí nghiệm thu định lượng (test case, % pass rate, chỉ số hiệu năng) và cơ chế phân loại defect theo mức độ nghiêm trọng; các nội dung tiêu chí nghiệm thu/kiểm thử lại được dẫn chiếu sang Phụ lục (chưa được cung cấp trong phần điều khoản truy hồi).", "recommendation": "Đề nghị bổ sung/đảm bảo thể hiện trực tiếp trong Hợp đồng hoặc Phụ lục 01 (đính kèm đầy đủ) các nội dung: (i) danh mục deliverables cụ thể, có thể đo lường/định lượng; (ii) tiêu chí nghiệm thu định lượng (số test case, ngưỡng % pass rate, các chỉ số hiệu năng); (iii) cơ chế xử lý defect theo mức độ nghiêm trọng (quy định rõ ngưỡng phân loại và thời hạn khắc phục tương ứng) để tránh phụ thuộc hoàn toàn vào diễn giải “đáp ứng yêu cầu” và tránh rủi ro tranh cãi khi nghiệm thu.", "evidences": [{"root": {"number": "10.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7992, "content": "10.3. VTIT cam đoan và bảo đảm rằng: - a) Có đầy đủ năng lực kỹ thuật, kinh nghiệm và nguồn lực cần thiết để thực hiện đúng và đầy đủ các nghĩa vụ đã cam kết trong Hợp đồng;\n\nb) Trong quá trình thực hiện Hợp đồng, sẽ không vi quyền sở hữu trí tuệ của bên thứ ba;\n\nc) Dịch vụ và sản phẩm bàn giao theo Hợp đồng sẽ đáp ứng các yêu cầu kỹ thuật, chức năng như đã thỏa thuận tại Hợp đồng và các Phụ lục kèm theo."}, "chain": []}, {"root": {"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": true, "score": 0.7885, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.762, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "REFERS_TO", "children": []}, {"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "12.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7844, "content": "12.4. Trường hợp Hợp đồng bị chấm dứt trước thời hạn mà không phải do lỗi của VTIT, VTIT vẫn có quyền:\n\na) Yêu cầu thanh toán đầy đủ cho phần công việc đã thực hiện và  được nghiệm thu tính đến thời điểm chấm dứt;\n\nb) Yêu cầu thanh toán các chi phí hợp lý đã phát sinh đối với phần công việc đang thực hiện dở dang (nếu có), trên cơ sở tài liệu, chứng từ hợp lệ được Khách hàng xác nhận;\n\nc) Không bị coi là vi phạm Hợp đồng hoặc chịu phạt vi phạm do việc chấm dứt không thuộc lỗi của mình."}, "chain": []}, {"root": {"number": "17.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7728, "content": "17.4. Nếu trong quá trình nghiệm thu, kết quả công việc không đáp ứng yêu cầu Hợp đồng thì Khách hàng có quyền yêu cầu VTIT khắc phục và chỉnh sửa, với điều kiện Khách hàng nêu rõ lý do bằng văn bản trong vòng 03 (ba) ngày làm việc kể từ ngày nhận bàn giao hoặc hoàn tất kiểm thử."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.762, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"root": {"number": "17.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7725, "content": "17.2. Sau khi ký HOC, theo yêu cầu của Khách hàng, Hai Bên sẽ phối hợp cài đặt phần mềm trên môi trường kiểm thử do Khách hàng chỉ định. VTIT chuẩn bị kịch bản kiểm thử và các điều kiện kỹ thuật cần thiết để tiến hành kiểm thử hệ thống. Khách hàng có trách nhiệm cung cấp đầy đủ dữ liệu giả lập, cấu hình môi trường và hỗ trợ kỹ thuật để việc kiểm thử được tiến hành đúng kế hoạch.\n\nTrong thời hạn 03 (ba) ngày làm việc kể từ khi kết thúc kiểm thử, Khách hàng có trách nhiệm xác nhận kết quả bằng văn bản và Hai Bên sẽ ký Biên bản nghiệm thu sơ bộ (PAC) ."}, "chain": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.762, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác
