<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Evidence Graph - Cây quan hệ đồ thị retrieval</title>
<style>
  :root {
    --ok: #1b7f3a; --ok-bg: #e6f6ea;
    --fail: #b3261e; --fail-bg: #fbe9e7;
    --border: #dcdcdc; --muted: #6b6b6b; --accent: #2f5fd6; --accent-bg: #eef1fb;
    --appendix: #b06000; --appendix-bg: #fff3e0;
    --matched-bg: #e6f6ea; --matched: #1b7f3a;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f7f7f8; color: #1a1a1a; }
  header { padding: 1rem 1.5rem; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 1.1rem; margin: 0 0 0.4rem; }
  header .sub { font-size: 0.82rem; color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 1rem 1.5rem 3rem; }

  .item { background: #fff; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 1rem; overflow: hidden; }
  .item-head { padding: 0.85rem 1.1rem; display: flex; align-items: center; gap: 0.7rem; cursor: pointer; }
  .badge { font-weight: 700; font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
  .badge.pass { background: var(--ok-bg); color: var(--ok); }
  .badge.fail { background: var(--fail-bg); color: var(--fail); }
  .item-id { font-weight: 700; font-size: 0.85rem; color: var(--muted); min-width: 3.5rem; }
  .item-q { flex: 1; font-size: 0.92rem; }
  .chevron { transition: transform 0.15s; color: var(--muted); }
  .item.open .chevron { transform: rotate(90deg); }
  .item-body { display: none; padding: 0 1.1rem 1.1rem; border-top: 1px solid var(--border); }
  .item.open .item-body { display: block; }

  .field { margin-top: 0.9rem; }
  .field-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin-bottom: 0.3rem; }
  .field-text { font-size: 0.88rem; line-height: 1.55; white-space: pre-wrap; background: #fafafa; border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.75rem; }

  /* Cây evidences - đường nối kiểu file-tree cổ điển (border-left/border-top), không dùng thư viện ngoài */
  .evidence-root { margin-top: 0.9rem; border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.8rem; background: #fcfcfd; }
  .evidence-root + .evidence-root { margin-top: 0.6rem; }
  ul.tree, ul.tree ul { list-style: none; margin: 0.3rem 0 0; padding-left: 1.3rem; }
  ul.tree { padding-left: 0; }
  ul.tree ul { position: relative; }
  ul.tree li { position: relative; padding: 0.25rem 0 0.25rem 1.1rem; }
  ul.tree ul li::before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0; border-left: 1.5px solid var(--border);
  }
  ul.tree ul li::after {
    content: ''; position: absolute; top: 1.05rem; left: 0; width: 0.9rem; border-top: 1.5px solid var(--border);
  }
  ul.tree ul li:last-child::before { height: 1.05rem; }

  .node { display: inline-flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .node-number { font-weight: 700; font-size: 0.88rem; color: #1a1a1a; }
  .node-title { font-size: 0.85rem; color: var(--muted); }
  .chip { font-size: 0.68rem; font-weight: 700; padding: 0.12rem 0.45rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.02em; }
  .chip.appendix { background: var(--appendix-bg); color: var(--appendix); }
  .chip.matched { background: var(--matched-bg); color: var(--matched); }
  .chip.relation { background: var(--accent-bg); color: var(--accent); font-family: ui-monospace, monospace; text-transform: none; }
  .node-content-toggle { font-size: 0.75rem; color: var(--accent); cursor: pointer; user-select: none; margin-left: 0.2rem; }
  .node-content { display: none; font-size: 0.82rem; line-height: 1.5; white-space: pre-wrap; background: #f3f4f7; border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.65rem; margin-top: 0.35rem; max-height: 220px; overflow-y: auto; }
  .node-content.open { display: block; }

  .empty { color: var(--muted); font-size: 0.85rem; padding: 0.5rem 0; }
  .filters { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
  .filters button { border: 1px solid var(--border); background: #fff; padding: 0.35rem 0.7rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
  .filters button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>Evidence Graph - Cây quan hệ đồ thị dẫn tới từng Điều khoản khớp</h1>
  <div class="sub" id="summary"></div>
  <div class="filters">
    <button data-filter="all" class="active">Tất cả</button>
    <button data-filter="fail">Fail</button>
    <button data-filter="pass">Pass</button>
  </div>
</header>

<main id="main"></main>

|              1000 |                 | 10.000.000.000     |\n\nb) Dịch vụ phát triển phần mềm là đối tượng không chịu thuế GTGT theo quy định pháp luật hiện hành tại thời điểm ký kết Hợp đồng. Trường hợp có phát sinh nghĩa vụ nộp thuế GTGT đối với Dịch vụ thì Khách hàng có trách nhiệm thanh toán phần thuế GTGT phát sinh bổ sung này cho VTIT hoặc nộp trực tiếp cho cơ quan nhà nước có thẩm quyền, trong thời hạn được ghi nhận tại thông báo của VTIT hoặc cơ quan nhà nước.\n\nc) Khách hàng thanh toán giá trị nghiệm thu thực tế cho VTIT."}, "chain": []}, {"root": {"number": "12.4", "title": "", "is_appendix": false, "matched": true, "score": 0.801, "content": "12.4. Trường hợp Hợp đồng bị chấm dứt trước thời hạn mà không phải do lỗi của VTIT, VTIT vẫn có quyền:\n\na) Yêu cầu thanh toán đầy đủ cho phần công việc đã thực hiện và  được nghiệm thu tính đến thời điểm chấm dứt;\n\nb) Yêu cầu thanh toán các chi phí hợp lý đã phát sinh đối với phần công việc đang thực hiện dở dang (nếu có), trên cơ sở tài liệu, chứng từ hợp lệ được Khách hàng xác nhận;\n\nc) Không bị coi là vi phạm Hợp đồng hoặc chịu phạt vi phạm do việc chấm dứt không thuộc lỗi của mình."}, "chain": []}, {"root": {"number": "19.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7946, "content": "19.1. Hợp đồng có hiệu lực kể từ ngày được đại diện hợp pháp của hai bên ký kết."}, "chain": []}, {"root": {"number": "2.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7882, "content": "2.2. Các Phụ lục đính kèm Hợp đồng;"}, "chain": []}, {"root": {"number": "2.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7834, "content": "Thành phần Hợp đồng và thứ tự ưu tiên pháp lý như sau :\n\n2.1. Văn bản Hợp đồng;"}, "chain": []}, {"root": {"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": true, "score": 0.7812, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật."}, "chain": [{"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}, {"root": {"number": "19.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7805, "content": "19.2. Hợp đồng có tính ràng buộc và có hiệu lực pháp luật đối với Các Bên cũng như các tổ chức kế thừa quyền lợi và trách nhiệm của Các Bên theo Hợp đồng."}, "chain": []}]}, {"item_id": "CL-02", "category": "Ngành nghề kinh doanh", "question": "Công ty có được thực hiện các công việc, dịch vụ hoặc bán các hàng hóa theo hợp đồng không?", "status": "fail", "evidence": "Điều 1.1, Điều 1.1.1 và các định nghĩa tại Điều 1: “VTIT cung cấp… Dịch vụ phần mềm… các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác…”. Điều 4.2(a) và Điều 14.1: “Cung cấp dịch vụ phần mềm…”, “VTIT cung cấp Dịch vụ phát triển/triển khai phần mềm… được mô tả tại Phụ lục 01…”. Không có điều khoản nào nêu rõ mã ngành/giấy phép/ngành nghề kinh doanh cụ thể mà VTIT được cấp phép; cũng không có Phụ lục 01 được cung cấp để đối chiếu chi tiết nội dung dịch vụ với danh mục ngành nghề tại checklist.", "reasoning": "Các điều khoản được cung cấp xác nhận VTIT cung cấp “dịch vụ phát triển/triển khai phần mềm”, nhưng không có bằng chứng trực tiếp nào đối chiếu/khẳng định dịch vụ thuộc đúng một mã ngành trong danh sách đã đăng ký theo checklist, và cũng không có bằng chứng về giấy phép/điều kiện đối với ngành nghề kinh doanh có điều kiện. Vì vậy cả hai điều kiện cần xác minh đều chưa được chứng minh đạt.", "recommendation": "Đề nghị bổ sung/ cung cấp: (i) thông tin ngành nghề đã đăng ký của VTIT và (ii) Phụ lục 01 (phạm vi/hạng mục cụ thể) cùng các tài liệu thể hiện VTIT có/không cần giấy phép đối với phần việc theo hợp đồng (nếu thuộc ngành nghề kinh doanh có điều kiện). Đồng thời rà soát lại diễn giải để bảo đảm nội dung “dịch vụ phần mềm” tại hợp đồng được đối chiếu rõ với mã ngành trong danh sách pass_criteria.", "evidences": [{"root": {"number": "1.2", "title" nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này."}, "chain": []}, {"root": {"number": "12.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7337, "content": "12.1. Hợp đồng chấm dứt trong các trường hợp sau:\n\na) Hợp đồng đã được Các Bên thực hiện đầy đủ nghĩa vụ theo quy định tại Hợp đồng.\n\nb) Các Bên có thỏa thuận chấm dứt Hợp đồng bằng văn bản. Trong trường hợp này, Hai Bên sẽ thống nhất các điều kiện cụ thể liên quan đến việc chấm dứt, bao gồm nhưng không giới hạn ở: trách nhiệm thanh toán, thời điểm hiệu lực chấm dứt, nghĩa vụ bảo mật và xử lý dữ liệu.\n\nc) Một trong Hai Bên bị tuyên bố phá sản, giải thể, hoặc bị cơ quan có thẩm quyền yêu cầu chấm dứt hoạt động kinh doanh."}, "chain": []}, {"root": {"number": "5.5", "title": "", "is_appendix": false, "matched": true, "score": 0.7299, "content": "5.5. Quyền sở hữu trí tuệ của các Bên đối với Phần mềm được xác định như sau:\n\n## Mô hình 1: Client-owned IP (KH sở hữu sản phẩm bàn giao)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ (bao gồm quyền tác giả đối với chương trình máy tính, quyền liên quan và các quyền tài sản khác theo pháp luật) đối với các hạng mục  bàn giao/deliverables được tạo ra riêng cho Khách hàng trong quá trình thực hiện Dịch vụ ('Sản phẩm bàn giao') sẽ thuộc về Khách hàng.\n\n- b. Kể từ thời điểm nêu trên, VTIT chuyển giao cho Khách hàng các quyền tài sản tương ứng đối với Sản phẩm bàn giao trong phạm vi pháp luật cho phép; Khách hàng có quyền sử dụng, khai thác, sửa đổi, sao chép, phát triển theo mục đích quy định tại Hợp đồng này.\n\n- c. VTIT cam kết không tái sử dụng Sản phẩm bàn giao (toàn bộ hoặc phần cốt lõi mang tính đặc thù của Khách hàng) cho khách hàng khác, trừ (i) phần thuộc Tài sản có sẵn/Background IP của VTIT; và/hoặc (ii) các thành phần mã nguồn mở/được cấp phép hợp pháp.\n\n## Mô hình 2: Vendor-owned IP (VTIT sở hữu bản quyền)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ đối với Sản phẩm bàn giao (bao gồm mọi cải tiến/phát triển phát sinh trong quá trình thực hiện Dịch vụ) sẽ thuộc về VTIT.\n\n- b. VTIT cấp cho Khách hàng một giấy phép sử dụng Sản phẩm bàn giao trọn đời, không độc quyền, không chuyển nhượng, không được cấp lại nếu không có chấp thuận bằng văn bản của VTIT, trong phạm vi mục đích sử dụng theo Hợp đồng/Phụ lục.\n\n- c. Khách hàng không được (và không được cho  phép bên khác) thực hiện reverse  engineering  (phân  tích  ngược/dịch  ngược),  decompile  (giải  biên dịch), disassemble (tháo rời/dịch ngược sang mã máy/assembly), tách/chiết mã nguồn, hoặc tạo sản phẩm phái sinh nhằm thương mại hóa/phân phối lại Sản phẩm bàn giao, trừ khi pháp luật bắt buộc. VTIT được quyền tái sử dụng,  cung  cấp  cho  khách  hàng  khác  các  thành  phần  chung/khung  kỹ thuật/know-how, với điều kiện không tiết lộ Thông tin mật của Khách hàng.\n\n## Mô hình 3 - Pre-existing IP (Background IP gixisting IP tạo sản phẩm phái sinh\n\n- a. 'Background IP' là toàn bộ mã nguồn, công cụ, thư viện, framework, tài liệu, quy trình, bí quyết kỹ thuật, nền tảng phần mềm và/hoặc các thành phần khác mà VTIT (hoặc bên cấp phép hợp pháp cho VTIT) đã sở hữu/có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập, không phụ thuộc vào dự án. Background IP thuộc sở hữu của VTIT (hoặc chủ thể có quyền), và không chuyển giao cho Khách hàng theo Hợp đồng này.\n\n- b. 'Project IP' là các hạng mục được phát triển riêng theo yêu cầu của Khách hàng  trong  phạm  vi  Dịch  vụ  (ví  dụ:  chức  năng,  luồng  nghiệp  vụ,  cấu hình/tùy  biến,  tài  liệu  đặc  thù,  mã  nguồn  custom  nếu  có).  Trừ  khi  Hợp đồng/Phụ lục quy định khác, Project IP sẽ thuộc về Khách hàng.\n\n- c. Trong phạm vi cần thiết để Khách hàng khai thác Project IP/Sản phẩm bàn giao, VTIT cấp cho Khách hàng giấy phép sử dụng Background IP trọn đời, không độc quyền, không chuyển nhượng, chỉ để vận hành/khai thác Sản phẩm bàn giao theo Hợp đồng.\n\n## Mô hình 4 - Đồng sở hữu; cả hai Bên được khai thác thương mại; VTIT độc quyền quyền đăng ký/đứng tên\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, các hạng mục/deliverables được tạo ra trong quá trình thực hiện Dịch vụ theo Hợp đồng ('Sản phẩm') là tài sản đồng sở hữu của VTIT và Khách hàng đối với phần quyền tài sản theo pháp luật về sở hữu trí tuệ, kể từ thời điểm Khách hàng hoàn tất thanh toán đầy đủ mọi khoản đến hạn theo Hợp đồng.\n\n- b. Quyền khai thác của các Bên: Mỗi Bên có quyền độc lập khai thác thương mại Sản phẩm (bao gồm phát triển, nâng cấp, phân phối, chuyển giao/cấp phép quyền sử dụng, cung cấp dưới dạng dịch vụ, cho thuê hoặc hình thức thương mại hợp pháp khác) cho bên thứ ba mà không phải xin chấp thuận của Bên còn lại, với điều kiện: (i) không tiết lộ Thông tin mật của Bên còn lại; (ii) không sử dụng dữ liệu, nhãn hiệu, tên thương mại, dấu hiệu nhận diện và/hoặc các tài sản riêng của Bên còn lại nếu không có chấp thuận bằng  văn  bản;  và  (iii)  tuân  thủ  các  nghĩa  vụ/bảo  lưu  quyền  đối  với Background IP và/hoặc mã nguồn mở (OSS) (nếu có).\n\n- c. Quyền đăng ký và đứng tên: VTIT là bên duy nhất có quyền nộp đơn, thực hiện thủ tục đăng ký (và đứng tên trên Giấy chứng nhận, nếu được cấp) đối với quyền tác giả/chương trình máy tính và/hoặc quyền sở hữu trí tuệ liên quan đến Sản phẩm. Việc VTIT đứng tên đăng ký không làm thay đổi bản chất đồng sở hữu và quyền khai thác của Khách hàng theo khoản 1 và khoản 2 Điều này.\n\n- d. Bảo lưu Background IP và OSS: Mọi tài sản có sẵn/Background IP của mỗi Bên và/hoặc các thành phần mã nguồn mở (OSS) được sử dụng trong Sản phẩm (nếu có) vẫn thuộc chủ sở hữu tương ứng và/hoặc tuân theo điều kiện giấy phép áp dụng; điều khoản đồng sở hữu tại Điều này không được hiểu là chuyển giao quyền sở hữu đối với Background IP/OSS.\n\nCác Bên lựa chọn Mô hình 1 để điều chỉnh quyền sở hữu trí tuệ trong Hợp đồng này."}, "chain": [{"number": "5.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.2. Sau khi VTIT hoàn thành việc bàn giao kết quả công việc cho Khách hàng và Khách hàng đã thanh toán đầy đủ cho VTIT theo quy định tại Hợp đồng, Khách hàng sẽ nhận được đầy đủ quyền sở hữu trí tuệ theo quy định tại khoản 5.6 Điều này.", "relation": "REFERS_TO", "children": [{"number": "5.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.1. VTIT cam kết không vi phạm bất kỳ quyền sở hữu trí tuệ nào của bên thứ ba hoặc sử dụng tài sản trí tuệ chưa được cấp phép hợp pháp trong quá trình cung cấp dịch vụ theo Hợp đồng này. Trường hợp có tranh chấp phát sinh liên quan đến quyền sở hữu trí tuệ do lỗi của VTIT, VTIT sẽ chịu trách nhiệm giải quyết các tranh chấp phát sinh (nếu có). Tuy nhiên, VTIT không chịu trách nhiệm đối với các nội dung, tài liệu, dữ liệu hoặc yêu cầu do Khách hàng cung cấp gây ra vi phạm.", "relation": "REFERS_TO", "children": []}]}, {"number": "5.3", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.3. VTIT có quyền sử dụng lại các thành phần, công cụ, thư viện, đoạn mã được phát triển sẵn hoặc không mang tính đặc thù cho Khách hàng trong các dự án\n\nkhác, với điều kiện không tiết lộ thông tin bảo mật hoặc vi phạm quyền sở hữu trí tuệ của Khách hàng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7395, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"number": "5.4", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.4. Trong quá trình cung cấp Dịch vụ và/hoặc phát triển Sản phẩm bàn giao, VTIT có thể sử dụng một số thành phần phần mềm mã nguồn mở (Open Source Software - OSS) được cấp phép hợp pháp theo các giấy phép mã nguồn mở tương ứng. Việc sử dụng các thành phần OSS này phải tuân thủ đầy đủ các điều kiện của giấy phép OSS áp dụng. Các thành phần OSS (nếu có) không thuộc quyền sở hữu của VTIT và không được chuyển giao quyền sở hữu theo Hợp đồng này; việc sử dụng, khai thác và phân phối các thành phần OSS sẽ tuân theo các điều kiện cấp phép của chủ sở hữu OSS tương ứng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "6.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7294, "content": "6.2. Những hạn chế tại khoản 1 Điều này sẽ không áp dụng đối với một trong số các thông tin sau:\n\na) Thông tin mà Bên nhận có thể chứng minh đã biết từ nguồn hợp  pháp không liên quan đến Bên cung cấp trước thời điểm nhận được thông tin từ Bên cung cấp; Thông tin đã công khai hoặc trở nên công khai mà không phải do hành vi vi phạm của Bên nhận;\n\nb) Thông tin do Bên nhận tự phát triển một cách độc lập mà không sử dụng Thông tin mật của Bên cung cấp;\n\nc) Thông tin được tiết lộ theo yêu cầu của pháp luật, cung cấp cho tòa án, trọng tài thương mại hoặc cơ quan nhà nước có thẩm quyền;\n\nd) Những thông tin bị tiết lộ cho công ty mẹ, các công ty thành viên của Một Bên, các cán bộ, nhân viên, người làm công, các đại lý, bên tư vấn, cung cấp dịch vụ của bên nhận thông tin trong trường hợp việc tiết lộ đó là cần thiết để thực hiện Hợp đồng, với điều kiện các bên được tiết lộ có nghĩa vụ bảo mật tương tự như quy định tại Hợp đồng này."}, "chain": [{"number": "6.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "6.1. Các Bên cam kết giữ bí mật tất cả các thông tin, báo cáo, tài liệu, dữ liệu có được từ Bên kia theo Hợp đồng. Không có sự đồng ý trước bằng văn bản của Bên cung cấp thông tin, Bên nhận thông tin không được tiết lộ bất kì thông tin, báo cáo, tài liệu và dữ liệu của Bên cung cấp thông tin cho Bên thứ ba. Các Bên cam kết tiến hành các  biện pháp bảo mật và các hoạt động dự phòng cần thiết và phù hợp để đảm bảo giữ bí mật những thông tin trên và đảm bảo những thông tin này không bị sử dụng sai mục đích trong quá trình thực hiện và sau khi kết thúc Hợp đồng.", "relation": "REFERS_TO", "children": []}]}]}, {"item_id": "CL-03", "category": "Sở hữu trí tuệ", "question": "Điều khoản bản quyền, sở hữu trí tuệ đã đầy đủ chưa? Xác định đúng đối tượng chưa?", "status": "fail", "evidence": "Các điều khoản liên quan: \n- Điều 5.1, 5.2, 5.3, 5.4, 5.5; trong đó: Điều 5.1 có cam kết không vi phạm IP bên thứ ba; Điều 5.2 nêu việc khách hàng nhận quyền sở hữu trí tuệ sau khi bàn giao và thanh toán đầy đủ; Điều 5.3 nêu VTIT có quyền tái sử dụng một số thành phần; Điều 5.4 quy định OSS; Điều 5.5 mô hình quyền sở hữu (client-owned/vendor-owned/background/project/đồng sở hữu) và các điều kiện kèm theo, cuối cùng các Bên “lựa chọn Mô hình 1”.\n- Điều 1.1.1.2 định nghĩa “Sản phẩm bàn giao/Deliverables” và “Phần mềm/Hệ thống”, “Background IP”, “Project IP”, “OSS”.\n- Điều 10.3 b) cam đoan trong quá trình thực hiện Hợp đồng sẽ không vi quyền sở hữu trí tuệ của bên thứ ba.\n- Điều 5.5 Model 1 c) có điều kiện VTIT cam kết không tái sử dụng sản phẩm bàn giao (toàn bộ hoặc phần cốt lõi đặc thù) cho khách hàng khác, trừ Background IP và OSS.", "reasoning": "Hợp đồng có khung quyền sở hữu trí tuệ khá rõ: cam kết không xâm phạm IP bên thứ ba; có cơ chế chuyển giao quyền sở hữu trí tuệ cho khách hàng sau khi bàn giao và thanh toán đầy đủ; có định nghĩa deliverables bao gồm mã nguồn/tài liệu/cấu hình; và nêu rõ phần VTIT giữ lại (Background IP/OSS). Tuy nhiên, tiêu chí riêng về “phạm vi license” của khách hàng (độc quyền/không độc quyền, thời hạn, lãnh thổ) không được thể hiện rõ theo đúng cấu trúc license trong mô hình các Bên đã lựa chọn (Mô hình 1 chuyển sang sở hữu deliverables cho khách hàng, không có điều khoản license nêu độc quyền-thời hạn-lãnh thổ). Do đó các mục về license theo checklist chưa được chứng minh đáp ứng đầy đủ.", "recommendation": "Bổ sung/điều chỉnh điều khoản về “giấy phép/quyền khai thác” áp dụng cho khách hàng (dù đang theo Mô hình 1) để nêu rõ: (i) độc quyền hay không độc quyền; (ii) thời hạn sử dụng; (iii) lãnh thổ áp dụng. Hoặc nếu theo hướng khách hàng “sở hữu” nên không còn “license”, cần chỉnh lại cách diễn đạt cho phù hợp checklist (làm rõ rằng tiêu chí độc quyền/thời hạn/lãnh thổ được thay thế bằng quyền sở hữu/khai thác tương ứng đối với deliverables).", "evidences": [{"root": {"number": "10.3", "title": "", "is_appendix": false, "matched": true, "score": 0.8565, "content": "10.3. VTIT cam đoan và bảo đảm rằng: - a) Có đầy đủ năng lực kỹ thuật, kinh nghiệm và nguồn lực cần thiết để thực hiện đúng và đầy đủ các nghĩa vụ đã cam kết trong Hợp đồng;\n\nb) Trong quá trình thực hiện Hợp đồng, sẽ không vi quyền sở hữu trí tuệ của bên thứ ba;\n\nc) Dịch vụ và sản phẩm bàn giao theo Hợp đồng sẽ đáp ứng các yêu cầu kỹ thuật, chức năng như đã thỏa thuận tại Hợp đồng và các Phụ lục kèm theo."}, "chain": []}, {"root": {"number": "5.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8226, "content": "5.2. Sau khi VTIT hoàn thành việc bàn giao kết quả công việc cho Khách hàng và Khách hàng đã thanh toán đầy đủ cho VTIT theo quy định tại Hợp đồng, Khách hàng sẽ nhận được đầy đủ quyền sở hữu trí tuệ theo quy định tại khoản 5.6 Điều này."}, "chain": [{"number": "5.5", "title": "", "is_appendix": false, "matched": true, "score": 0.8033, "content": "5.5. Quyền sở hữu trí tuệ của các Bên đối với Phần mềm được xác định như sau:\n\n## Mô hình 1: Client-owned IP (KH sở hữu sản phẩm bàn giao)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ (bao gồm quyền tác giả đối với chương trình máy tính, quyền liên quan và các quyền tài sản khác theo pháp luật) đối với các hạng mục  bàn giao/deliverables được tạo ra riêng cho Khách hàng trong quá trình thực hiện Dịch vụ ('Sản phẩm bàn giao') sẽ thuộc về Khách hàng.\n\n- b. Kể từ thời điểm nêu trên, VTIT chuyển giao cho Khách hàng các quyền tài sản tương ứng đối với Sản phẩm bàn giao trong phạm vi pháp luật cho phép; Khách hàng có quyền sử dụng, khai thác, sửa đổi, sao chép, phát triển theo mục đích quy định tại Hợp đồng này.\n\n- c. VTIT cam kết không tái sử dụng Sản phẩm bàn giao (toàn bộ hoặc phần cốt lõi mang tính đặc thù của Khách hàng) cho khách hàng khác, trừ (i) phần thuộc Tài sản có sẵn/Background IP của VTIT; và/hoặc (ii) các thành phần mã nguồn mở/được cấp phép hợp pháp.\n\n## Mô hình 2: Vendor-owned IP (VTIT sở hữu bản quyền)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ đối với Sản phẩm bàn giao (bao gồm mọi cải tiến/phát triển phát sinh trong quá trình thực hiện Dịch vụ) sẽ thuộc về VTIT.\n\n- b. VTIT cấp cho Khách hàng một giấy phép sử dụng Sản phẩm bàn giao trọn đời, không độc quyền, không chuyển nhượng, không được cấp lại nếu không có chấp thuận bằng văn bản của VTIT, trong phạm vi mục đích sử dụng theo Hợp đồng/Phụ lục.\n\n- c. Khách hàng không được (và không được cho  phép bên khác) thực hiện reverse  engineering  (phân  tích  ngược/dịch  ngược),  decompile  (giải  biên dịch), disassemble (tháo rời/dịch ngược sang mã máy/assembly), tách/chiết mã nguồn, hoặc tạo sản phẩm phái sinh nhằm thương mại hóa/phân phối lại Sản phẩm bàn giao, trừ khi pháp luật bắt buộc. VTIT được quyền tái sử dụng,  cung  cấp  cho  khách  hàng  khác  các  thành  phần  chung/khung  kỹ thuật/know-how, với điều kiện không tiết lộ Thông tin mật của Khách hàng.\n\n## Mô hình 3 - Pre-existing IP (Background IP gixisting IP tạo sản phẩm phái sinh\n\n- a. 'Background IP' là toàn bộ mã nguồn, công cụ, thư viện, framework, tài liệu, quy trình, bí quyết kỹ thuật, nền tảng phần mềm và/hoặc các thành phần khác mà VTIT (hoặc bên cấp phép hợp pháp cho VTIT) đã sở hữu/có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập, không phụ thuộc vào dự án. Background IP thuộc sở hữu của VTIT (hoặc chủ thể có quyền), và không chuyển giao cho Khách hàng theo Hợp đồng này.\n\n- b. 'Project IP' là các hạng mục được phát triển riêng theo yêu cầu của Khách hàng  trong  phạm  vi  Dịch  vụ  (ví  dụ:  chức  năng,  luồng  nghiệp  vụ,  cấu hình/tùy  biến,  tài  liệu  đặc  thù,  mã  nguồn  custom  nếu  có).  Trừ  khi  Hợp đồng/Phụ lục quy định khác, Project IP sẽ thuộc về Khách hàng.\n\n- c. Trong phạm vi cần thiết để Khách hàng khai thác Project IP/Sản phẩm bàn giao, VTIT cấp cho Khách hàng giấy phép sử dụng Background IP trọn đời, không độc quyền, không chuyển nhượng, chỉ để vận hành/khai thác Sản phẩm bàn giao theo Hợp đồng.\n\n## Mô hình 4 - Đồng sở hữu; cả hai Bên được khai thác thương mại; VTIT độc quyền quyền đăng ký/đứng tên\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, các hạng mục/deliverables được tạo ra trong quá trình thực hiện Dịch vụ theo Hợp đồng ('Sản phẩm') là tài sản đồng sở hữu của VTIT và Khách hàng đối với phần quyền tài sản theo pháp luật về sở hữu trí tuệ, kể từ thời điểm Khách hàng hoàn tất thanh toán đầy đủ mọi khoản đến hạn theo Hợp đồng.\n\n- b. Quyền khai thác của các Bên: Mỗi Bên có quyền độc lập khai thác thương mại Sản phẩm (bao gồm phát triển, nâng cấp, phân phối, chuyển giao/cấp phép quyền sử dụng, cung cấp dưới dạng dịch vụ, cho thuê hoặc hình thức thương mại hợp pháp khác) cho bên thứ ba mà không phải xin chấp thuận của Bên còn lại, với điều kiện: (i) không tiết lộ Thông tin mật của Bên còn lại; (ii) không sử dụng dữ liệu, nhãn hiệu, tên thương mại, dấu hiệu nhận diện và/hoặc các tài sản riêng của Bên còn lại nếu không có chấp thuận bằng  văn  bản;  và  (iii)  tuân  thủ  các  nghĩa  vụ/bảo  lưu  quyền  đối  với Background IP và/hoặc mã nguồn mở (OSS) (nếu có).\n\n- c. Quyền đăng ký và đứng tên: VTIT là bên duy nhất có quyền nộp đơn, thực hiện thủ tục đăng ký (và đứng tên trên Giấy chứng nhận, nếu được cấp) đối với quyền tác giả/chương trình máy tính và/hoặc quyền sở hữu trí tuệ liên quan đến Sản phẩm. Việc VTIT đứng tên đăng ký không làm thay đổi bản chất đồng sở hữu và quyền khai thác của Khách hàng theo khoản 1 và khoản 2 Điều này.\n\n- d. Bảo lưu Background IP và OSS: Mọi tài sản có sẵn/Background IP của mỗi Bên và/hoặc các thành phần mã nguồn mở (OSS) được sử dụng trong Sản phẩm (nếu có) vẫn thuộc chủ sở hữu tương ứng và/hoặc tuân theo điều kiện giấy phép áp dụng; điều khoản đồng sở hữu tại Điều này không được hiểu là chuyển giao quyền sở hữu đối với Background IP/OSS.\n\nCác Bên lựa chọn Mô hình 1 để điều chỉnh quyền sở hữu trí tuệ trong Hợp đồng này.", "relation": "REFERS_TO", "children": [{"number": "5.3", "title": "", "is_appendix": false, "matched": true, "score": 0.785, "content": "5.3. VTIT có quyền sử dụng lại các thành phần, công cụ, thư viện, đoạn mã được phát triển sẵn hoặc không mang tính đặc thù cho Khách hàng trong các dự án\n\nkhác, với điều kiện không tiết lộ thông tin bảo mật hoặc vi phạm quyền sở hữu trí tuệ của Khách hàng.", "relation": "REFERS_TO", "children": [{"number": "5.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.1. VTIT cam kết không vi phạm bất kỳ quyền sở hữu trí tuệ nào của bên thứ ba hoặc sử dụng tài sản trí tuệ chưa được cấp phép hợp pháp trong quá trình cung cấp dịch vụ theo Hợp đồng này. Trường hợp có tranh chấp phát sinh liên quan đến quyền sở hữu trí tuệ do lỗi của VTIT, VTIT sẽ chịu trách nhiệm giải quyết các tranh chấp phát sinh (nếu có). Tuy nhiên, VTIT không chịu trách nhiệm đối với các nội dung, tài liệu, dữ liệu hoặc yêu cầu do Khách hàng cung cấp gây ra vi phạm.", "relation": "REFERS_TO", "children": []}, {"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"number": "5.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7847, "content": "5.4. Trong quá trình cung cấp Dịch vụ và/hoặc phát triển Sản phẩm bàn giao, VTIT có thể sử dụng một số thành phần phần mềm mã nguồn mở (Open Source Software - OSS) được cấp phép hợp pháp theo các giấy phép mã nguồn mở tương ứng. Việc sử dụng các thành phần OSS này phải tuân thủ đầy đủ các điều kiện của giấy phép OSS áp dụng. Các thành phần OSS (nếu có) không thuộc quyền sở hữu của VTIT và không được chuyển giao quyền sở hữu theo Hợp đồng này; việc sử dụng, khai thác và phân phối các thành phần OSS sẽ tuân theo các điều kiện cấp phép của chủ sở hữu OSS tương ứng.", "relation": "REFERS_TO", "children": []}]}]}, {"root": {"number": "5.5", "title": "", "is_appendix": false, "matched": true, "score": 0.8033, "content": "5.5. Quyền sở hữu trí tuệ của các Bên đối với Phần mềm được xác định như sau:\n\n## Mô hình 1: Client-owned IP (KH sở hữu sản phẩm bàn giao)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ (bao gồm quyền tác giả đối với chương trình máy tính, quyền liên quan và các quyền tài sản khác theo pháp luật) đối với các hạng mục  bàn giao/deliverables được tạo ra riêng cho Khách hàng trong quá trình thực hiện Dịch vụ ('Sản phẩm bàn giao') sẽ thuộc về Khách hàng.\n\n- b. Kể từ thời điểm nêu trên, VTIT chuyển giao cho Khách hàng các quyền tài sản tương ứng đối với Sản phẩm bàn giao trong phạm vi pháp luật cho phép; Khách hàng có quyền sử dụng, khai thác, sửa đổi, sao chép, phát triển theo mục đích quy định tại Hợp đồng này.\n\n- c. VTIT cam kết không tái sử dụng Sản phẩm bàn giao (toàn bộ hoặc phần cốt lõi mang tính đặc thù của Khách hàng) cho khách hàng khác, trừ (i) phần thuộc Tài sản có sẵn/Background IP của VTIT; và/hoặc (ii) các thành phần mã nguồn mở/được cấp phép hợp pháp.\n\n## Mô hình 2: Vendor-owned IP (VTIT sở hữu bản quyền)\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, toàn bộ quyền sở hữu trí tuệ đối với Sản phẩm bàn giao (bao gồm mọi cải tiến/phát triển phát sinh trong quá trình thực hiện Dịch vụ) sẽ thuộc về VTIT.\n\n- b. VTIT cấp cho Khách hàng một giấy phép sử dụng Sản phẩm bàn giao trọn đời, không độc quyền, không chuyển nhượng, không được cấp lại nếu không có chấp thuận bằng văn bản của VTIT, trong phạm vi mục đích sử dụng theo Hợp đồng/Phụ lục.\n\n- c. Khách hàng không được (và không được cho  phép bên khác) thực hiện reverse  engineering  (phân  tích  ngược/dịch  ngược),  decompile  (giải  biên dịch), disassemble (tháo rời/dịch ngược sang mã máy/assembly), tách/chiết mã nguồn, hoặc tạo sản phẩm phái sinh nhằm thương mại hóa/phân phối lại Sản phẩm bàn giao, trừ khi pháp luật bắt buộc. VTIT được quyền tái sử dụng,  cung  cấp  cho  khách  hàng  khác  các  thành  phần  chung/khung  kỹ thuật/know-how, với điều kiện không tiết lộ Thông tin mật của Khách hàng.\n\n## Mô hình 3 - Pre-existing IP (Background IP gixisting IP tạo sản phẩm phái sinh\n\n- a. 'Background IP' là toàn bộ mã nguồn, công cụ, thư viện, framework, tài liệu, quy trình, bí quyết kỹ thuật, nền tảng phần mềm và/hoặc các thành phần khác mà VTIT (hoặc bên cấp phép hợp pháp cho VTIT) đã sở hữu/có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập, không phụ thuộc vào dự án. Background IP thuộc sở hữu của VTIT (hoặc chủ thể có quyền), và không chuyển giao cho Khách hàng theo Hợp đồng này.\n\n- b. 'Project IP' là các hạng mục được phát triển riêng theo yêu cầu của Khách hàng  trong  phạm  vi  Dịch  vụ  (ví  dụ:  chức  năng,  luồng  nghiệp  vụ,  cấu hình/tùy  biến,  tài  liệu  đặc  thù,  mã  nguồn  custom  nếu  có).  Trừ  khi  Hợp đồng/Phụ lục quy định khác, Project IP sẽ thuộc về Khách hàng.\n\n- c. Trong phạm vi cần thiết để Khách hàng khai thác Project IP/Sản phẩm bàn giao, VTIT cấp cho Khách hàng giấy phép sử dụng Background IP trọn đời, không độc quyền, không chuyển nhượng, chỉ để vận hành/khai thác Sản phẩm bàn giao theo Hợp đồng.\n\n## Mô hình 4 - Đồng sở hữu; cả hai Bên được khai thác thương mại; VTIT độc quyền quyền đăng ký/đứng tên\n\n- a. Trừ khi Hợp đồng/Phụ lục quy định khác, các hạng mục/deliverables được tạo ra trong quá trình thực hiện Dịch vụ theo Hợp đồng ('Sản phẩm') là tài sản đồng sở hữu của VTIT và Khách hàng đối với phần quyền tài sản theo pháp luật về sở hữu trí tuệ, kể từ thời điểm Khách hàng hoàn tất thanh toán đầy đủ mọi khoản đến hạn theo Hợp đồng.\n\n- b. Quyền khai thác của các Bên: Mỗi Bên có quyền độc lập khai thác thương mại Sản phẩm (bao gồm phát triển, nâng cấp, phân phối, chuyển giao/cấp phép quyền sử dụng, cung cấp dưới dạng dịch vụ, cho thuê hoặc hình thức thương mại hợp pháp khác) cho bên thứ ba mà không phải xin chấp thuận của Bên còn lại, với điều kiện: (i) không tiết lộ Thông tin mật của Bên còn lại; (ii) không sử dụng dữ liệu, nhãn hiệu, tên thương mại, dấu hiệu nhận diện và/hoặc các tài sản riêng của Bên còn lại nếu không có chấp thuận bằng  văn  bản;  và  (iii)  tuân  thủ  các  nghĩa  vụ/bảo  lưu  quyền  đối  với Background IP và/hoặc mã nguồn mở (OSS) (nếu có).\n\n- c. Quyền đăng ký và đứng tên: VTIT là bên duy nhất có quyền nộp đơn, thực hiện thủ tục đăng ký (và đứng tên trên Giấy chứng nhận, nếu được cấp) đối với quyền tác giả/chương trình máy tính và/hoặc quyền sở hữu trí tuệ liên quan đến Sản phẩm. Việc VTIT đứng tên đăng ký không làm thay đổi bản chất đồng sở hữu và quyền khai thác của Khách hàng theo khoản 1 và khoản 2 Điều này.\n\n- d. Bảo lưu Background IP và OSS: Mọi tài sản có sẵn/Background IP của mỗi Bên và/hoặc các thành phần mã nguồn mở (OSS) được sử dụng trong Sản phẩm (nếu có) vẫn thuộc chủ sở hữu tương ứng và/hoặc tuân theo điều kiện giấy phép áp dụng; điều khoản đồng sở hữu tại Điều này không được hiểu là chuyển giao quyền sở hữu đối với Background IP/OSS.\n\nCác Bên lựa chọn Mô hình 1 để điều chỉnh quyền sở hữu trí tuệ trong Hợp đồng này."}, "chain": [{"number": "5.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8226, "content": "5.2. Sau khi VTIT hoàn thành việc bàn giao kết quả công việc cho Khách hàng và Khách hàng đã thanh toán đầy đủ cho VTIT theo quy định tại Hợp đồng, Khách hàng sẽ nhận được đầy đủ quyền sở hữu trí tuệ theo quy định tại khoản 5.6 Điều này.", "relation": "REFERS_TO", "children": [{"number": "5.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "5.1. VTIT cam kết không vi phạm bất kỳ quyền sở hữu trí tuệ nào của bên thứ ba hoặc sử dụng tài sản trí tuệ chưa được cấp phép hợp pháp trong quá trình cung cấp dịch vụ theo Hợp đồng này. Trường hợp có tranh chấp phát sinh liên quan đến quyền sở hữu trí tuệ do lỗi của VTIT, VTIT sẽ chịu trách nhiệm giải quyết các tranh chấp phát sinh (nếu có). Tuy nhiên, VTIT không chịu trách nhiệm đối với các nội dung, tài liệu, dữ liệu hoặc yêu cầu do Khách hàng cung cấp gây ra vi phạm.", "relation": "REFERS_TO", "children": []}]}, {"number": "5.3", "title": "", "is_appendix": false, "matched": true, "score": 0.785, "content": "5.3. VTIT có quyền sử dụng lại các thành phần, công cụ, thư viện, đoạn mã được phát triển sẵn hoặc không mang tính đặc thù cho Khách hàng trong các dự án\n\nkhác, với điều kiện không tiết lộ thông tin bảo mật hoặc vi phạm quyền sở hữu trí tuệ của Khách hàng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}, {"number": "5.4", "title": "", "is_appendix": false, "matched": true, "score": 0.7847, "content": "5.4. Trong quá trình cung cấp Dịch vụ và/hoặc phát triển Sản phẩm bàn giao, VTIT có thể sử dụng một số thành phần phần mềm mã nguồn mở (Open Source Software - OSS) được cấp phép hợp pháp theo các giấy phép mã nguồn mở tương ứng. Việc sử dụng các thành phần OSS này phải tuân thủ đầy đủ các điều kiện của giấy phép OSS áp dụng. Các thành phần OSS (nếu có) không thuộc quyền sở hữu của VTIT và không được chuyển giao quyền sở hữu theo Hợp đồng này; việc sử dụng, khai thác và phân phối các thành phần OSS sẽ tuân theo các điều kiện cấp phép của chủ sở hữu OSS tương ứng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "7.2", "title": "", "is_appendix": false, "matched": true, "score": 0.8003, "content": "7.2. Trong thời gian thực hiện Hợp đồng và trong vòng 12 tháng kể từ ngày Hợp đồng chấm dứt hoặc hết hạn vì bất kỳ lý do nào, Khách hàng cam kết:\n\na) Không trực tiếp hoặc gián tiếp tuyển dụng, thuê, mời làm việc, lôi kéo hoặc khuyến khích bất kỳ nhân sự nào (bao gồm cán bộ, nhân viên, thực tập sinh, cộng tác viên và các nhân sự khác) của VTIT mà Khách hàng đã biết hoặc tiếp xúc trong quá trình thực hiện Hợp đồng;\n\nb) Không đề nghị, khuyến khích hoặc hỗ trợ bất kỳ nhân sự nào của VTIT chấm dứt hợp đồng lao động, hợp tác hoặc quan hệ làm việc với VTIT."}, "chain": []}, {"root": {"number": "12.2", "title": "", "is_appendix": false, "matched": true, "score": 0.7951, "content": "12.2. Một trong Hai Bên có quyền chấm dứt Hợp đồng nếu Bên kia có hành vi vi phạm cơ bản nghĩa vụ hợp đồng, bao gồm nhưng không giới hạn ở:\n\na) Không thực hiện nghĩa vụ thanh toán trong thời hạn quá 30 ngày kể từ ngày đến hạn mà không có lý do chính đáng hoặc không được khắc phục sau khi nhận được thông báo bằng văn bản từ Bên còn lại;\n\nb) Từ chối bàn giao hoặc từ chối thực hiện Hợp đồng hoặc đơn phương đình chỉ công việc trái Hợp đồng;\n\nc) Một Bên vi phạm cam đoan và bảo đảm theo quy định tại khoản 10.1 Điều 11 Hợp đồng này.\n\nd) VTIT có quyền chấm dứt Hợp đồng nếu Khách hàng mất khả năng thanh toán hoặc có căn cứ hợp lý để xác định Khách hàng không còn khả năng thanh toán các khoản đến hạn theo Hợp đồng.\n\ne) Vi phạm nghiêm trọng nghĩa vụ Hợp đồng.\n\nTrong các trường hợp này, Bên bị vi phạm phải được thông báo bằng văn bản và có ít nhất 15 ngày làm việc để khắc phục trước khi Bên kia chính thức chấm dứt Hợp đồng."}, "chain": [{"number": "10.1", "title": "", "is_appendix": false, "matched": true, "score": 0.7804, "content": "10.1. Các Bên cam đoan và bảo đảm rằng:\n\na) Có đầy đủ năng lực pháp lý, tư cách pháp nhân và quyền ký kết và thực hiện Hợp đồng này theo quy định của pháp luật;\n\nb) Phần mềm, hệ thống là phù hợp với quy định của pháp luật hiện hành, không vi phạm bất kỳ quy định cấm nào, không bị cấm phát triển hoặc sử dụng theo pháp luật Việt Nam hoặc điều ước quốc tế có hiệu lực; việc xây dựng Phần mềm, hệ thống không làm phát sinh trách nhiệm pháp lý cho VTIT với tư cách là bên cung cấp dịch vụ.\n\nc) Phần mềm/hệ thống và/hoặc Dịch vụ theo Hợp đồng không được sử dụng, trực tiếp hoặc gián tiếp, cho bất kỳ mục đích nào liên quan đến khủng bố,\n\ntài trợ khủng bố, tội phạm xuyên quốc gia/tội phạm quốc tế, rửa tiền, buôn bán người, hoặc các hành vi bị cấm theo pháp luật Việt Nam và/hoặc các điều ước quốc tế có hiệu lực; Khách hàng cam kết bảo đảm việc sử dụng là hợp pháp và bồi thường, giữ cho VTIT không bị thiệt hại trước mọi khiếu nại, yêu cầu, chế tài phát sinh từ việc Khách hàng vi phạm cam kết này.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao phần mềm và/hoặc các dịch vụ liên quan khác do VTIT cung cấp cho Khách hàng theo phạm vi quy định tại Hợp đồng và các Phụ lục.\n\nc) ' Sản phẩm bàn giao ' (Deliverables) là toàn bộ kết quả công việc, sản phẩm phần mềm, mã nguồn, tài liệu kỹ thuật, tài liệu hướng dẫn sử dụng, cấu hình hệ thống, hoặc các hạng mục khác được VTIT phát triển và bàn giao cho Khách hàng theo Hợp đồng.\n\nd) ' Phần mềm ' hoặc ' Hệ thống ' là chương trình máy tính, ứng dụng phần mềm, nền tảng công nghệ, hệ thống thông tin hoặc giải pháp công nghệ được phát triển, tùy chỉnh hoặc triển khai theo Hợp đồng.\n\ne) ' Background IP ' là toàn bộ mã nguồn, thư viện phần mềm, công cụ, framework, tài liệu, quy trình, bí quyết kỹ thuật hoặc các thành phần công nghệ mà VTIT hoặc bên cấp phép hợp pháp cho VTIT đã sở hữu hoặc có quyền sử dụng trước thời điểm thực hiện Hợp đồng hoặc được phát triển độc lập ngoài phạm vi dự án.\n\nf) ' Project IP ' là các thành phần phần mềm, chức năng, cấu hình, tài liệu hoặc sản phẩm công nghệ được phát triển riêng cho Khách hàng trong phạm vi thực hiện Dịch vụ theo Hợp đồng.\n\ng) ' OSS ' (Open Source Software) là phần mềm mã nguồn mở được cấp phép sử dụng theo các giấy phép mã nguồn mở tương ứng của chủ sở hữu phần mềm.\n\nh) ' Phiếu giao việc ',  ' Danh sách công việc '  hoặc các tài liệu giao việc tương đương là các tài liệu ghi nhận chi tiết phạm vi công việc, yêu cầu kỹ thuật, khối lượng, tiến độ hoặc các điều kiện thực hiện cụ thể đối với từng hạng mục Dịch vụ, được Các Bên thống nhất bằng văn bản trong quá trình thực hiện Hợp đồng.\n\ni) ' Change Request ' (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}, {"root": {"number": "3", "title": "QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG", "is_appendix": false, "matched": true, "score": 0.7944, "content": "Điều 3. QUYỀN VÀ NGHĨA VỤ CỦA KHÁCH HÀNG\n\n\n\n## 2.1. Quyền của Khách hàng:\n\na) Được cung cấp đầy đủ, đúng thời hạn, đúng nội dung, phạm vi, chất lượng và tiêu chuẩn kỹ thuật của Dịch vụ theo đúng thỏa thuận tại Hợp đồng này, các Phụ lục, Danh sách công việc và/hoặc Phiếu giao việc được hai Bên thống nhất;\n\nb) Có quyền giám sát, kiểm tra quá trình cung cấp dịch vụ của VTIT nhằm bảo đảm tuân thủ đúng các nội dung, tiến độ, chất lượng và tiêu chuẩn kỹ thuật quy định trong Hợp đồng;\n\nc) Có quyền yêu cầu VTIT báo cáo tiến độ thực hiện công việc định kỳ theo thỏa thuận của các Bên hoặc đột xuất trong trường hợp cần thiết, với điều kiện việc yêu cầu này không gây gián đoạn hoặc ảnh hưởng đáng kể đến quá trình cung cấp dịch vụ bình thường của VTIT;\n\nd) Có quyền tiếp nhận bàn giao các hạng mục/tài liệu thuộc phạm vi Dịch vụ theo Hợp đồng và Phụ lục.\n\ne) Có quyền yêu cầu VTIT giải thích/ hướng dẫn sử dụng ở mức hợp lý đối với các hạng mục bàn giao thuộc phạm vi Dịch vụ theo Hợp đồng/Phụ lục; việc hướng dẫn này không bao gồm đào tạo chuyên sâu, tư vấn mở rộng, phát triển chức năng mới hoặc các công việc ngoài phạm vi Dịch vụ, trừ khi các Bên có thỏa thuận riêng bằng văn bản.\n\n2. 2.2. Nghĩa vụ của Khách hàng: - a) Cung cấp đầy đủ, kịp thời cho VTIT các cơ sở vật chất, thiết bị phù hợp, thông tin, tài liệu, môi trường làm việc, môi trường kiểm thử hoặc môi trường bàn giao phù hợp và các điều kiện cần thiết khác để VTIT đủ điều kiện triển khai, thực hiện công việc theo đúng thỏa thuận tại Hợp đồng;\n\nb) Cử cán bộ có chuyên môn và kinh nghiệm làm đầu mối làm việc với VTIT, có trách nhiệm mô tả bài toán nghiệp vụ, giải đáp thắc mắc liên quan để VTIT triển khai dịch vụ một cách hiệu quả;\n\nc) Hướng dẫn, phối hợp và đưa ra các yêu cầu cụ thể đối với VTIT trong quá trình triển khai công việc; đảm bảo phản hồi, cung cấp yêu cầu trong thời hạn hợp lý để không ảnh hưởng đến tiến độ triển khai dịch vụ của VTIT;\n\nd) Cung cấp cho VTIT các biểu mẫu, quy trình nghiệp vụ, quy định nội bộ và các hướng dẫn liên quan đến công việc để VTIT có cơ sở thực hiện, đảm bảo đúng chất lượng và yêu cầu kỹ thuật;\n\ne) Có trách nhiệm xác nhận bằng văn bản đối với các công việc do VTIT đã thực hiện; tiếp nhận, xem xét, phản hồi và/hoặc phê duyệt các kết quả bàn giao của VTIT trong thời hạn quy định hoặc theo thỏa thuận giữa Các Bên;\n\nf) Thực hiện thanh toán cho VTIT đúng thời hạn, đầy đủ theo giá trị nghiệm thu thực tế và theo phương thức thanh toán quy định tại Hợp đồng này;\n\n9. 2.3. Các quyền và nghĩa vụ khác theo thỏa thuận tại Hợp đồng này và quy định của pháp luật."}, "chain": [{"number": "1.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.1. VTIT cung cấp cho Khách hàng Dịch vụ phần mềm với các yêu cầu cụ thể được nêu tại Phụ lục kèm theo Hợp đồng.", "relation": "REFERS_TO", "children": [{"number": "1.2", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "1.2. Trong phạm vi Hợp đồng này, các thuật ngữ dưới đây được hiểu như sau, trừ khi ngữ cảnh có quy định khác:\n\na) ' Hợp đồng ' là Hợp đồng dịch vụ phát triển phần mềm này, bao gồm toàn bộ nội dung Hợp đồng, các Phụ lục kèm theo, Biên bản thương thảo (nếu có) và các tài liệu khác được Các Bên thống nhất bằng văn bản là một phần của Hợp đồng.\n\nb) ' Dịch vụ ' là các dịch vụ phát triển, triển khai, tùy biến, bàn giao ph
