 (Yêu cầu thay đổi) là yêu cầu của một Bên về việc điều chỉnh phạm vi công việc, yêu cầu kỹ thuật, tiến độ, khối lượng hoặc chi phí so với nội dung đã thỏa thuận trong Hợp đồng và các Phụ lục.\n\nj) ' HOC ' (Hand Over Certificate) là  Biên bản bàn giao phần mềm, ghi nhận việc VTIT đã hoàn thành bàn giao sơ bộ sản phẩm hoặc hạng mục công việc cho Khách hàng theo quy định tại Hợp đồng.\n\nk) ' PAC ' (Provisional Acceptance Certificate) là Biên bản nghiệm thu sơ bộ được ký sau khi hoàn thành kiểm thử và xác nhận phần mềm đáp ứng cơ bản các yêu cầu kỹ thuật.\n\nl) ' FAC ' (Final Acceptance Certificate) là Biên bản nghiệm thu tổng thể, ghi nhận việc Khách hàng đã chấp nhận hoàn toàn kết quả Dịch vụ theo Hợp đồng.\n\nm) ' Thông tin mật ' là mọi thông tin, tài liệu, dữ liệu, hồ sơ, mã nguồn, tài liệu kỹ thuật, thông tin kinh doanh hoặc thông tin khác được một Bên cung cấp cho Bên còn lại trong quá trình thực hiện Hợp đồng và được coi là thông tin bảo mật theo quy định tại Hợp đồng này.\n\nn) ' Ngày làm việc ' là ngày không bao gồm thứ Bảy, Chủ nhật và các ngày nghỉ lễ theo quy định pháp luật Việt Nam.\n\no) ' Sự kiện Bất khả kháng ' được hiểu theo quy định tại Điều 8 của Hợp đồng này.", "relation": "DEFINES", "children": []}]}]}, {"root": {"number": "6.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7695, "content": "6.3. Trừ khi có thỏa thuận cụ thể khác bằng văn bản, Các Bên thống nhất rằng việc tồn tại mối quan hệ hợp tác giữa Khách hàng và VTIT theo Hợp đồng này không được coi là thông tin bảo mật tuyệt đối. Một Bên ('Bên Sử dụng') có thể đề cập đến tên của Bên còn lại, phạm vi dịch vụ, thời gian thực hiện và giá trị Hợp đồng trong hồ sơ chứng minh năng lực, kinh nghiệm, với điều kiện:\n\na) Việc sử dụng chỉ nhằm mục đích chứng minh năng lực, không được trình bày sai lệch, gây hiểu nhầm hoặc ảnh hưởng đến uy tín, quyền lợi hợp pháp của Bên còn lại;\n\nb) Bên Sử dụng không tiết lộ bất kỳ thông tin kỹ thuật, nội dung nghiệp vụ, dữ liệu nội bộ, tài liệu hoặc thông tin nào khác thuộc phạm vi bảo mật của Hợp đồng này;\n\nc) Trường hợp Bên Sử dụng có hành vi vi phạm các điều kiện tại khoản này và Bên còn lại có yêu cầu bằng văn bản, Bên Sử dụng có trách nhiệm chấm dứt việc sử dụng và/hoặc gỡ bỏ, thu hồi (trong phạm vi kiểm soát hợp lý của mình) mọi tài liệu/hồ sơ có chứa các thông tin nêu tại khoản này trong vòng 05 (năm) ngày làm việc kể từ ngày nhận được yêu cầu đó."}, "chain": [{"number": "6.1", "title": "", "is_appendix": false, "matched": false, "score": null, "content": "6.1. Các Bên cam kết giữ bí mật tất cả các thông tin, báo cáo, tài liệu, dữ liệu có được từ Bên kia theo Hợp đồng. Không có sự đồng ý trước bằng văn bản của Bên cung cấp thông tin, Bên nhận thông tin không được tiết lộ bất kì thông tin, báo cáo, tài liệu và dữ liệu của Bên cung cấp thông tin cho Bên thứ ba. Các Bên cam kết tiến hành các  biện pháp bảo mật và các hoạt động dự phòng cần thiết và phù hợp để đảm bảo giữ bí mật những thông tin trên và đảm bảo những thông tin này không bị sử dụng sai mục đích trong quá trình thực hiện và sau khi kết thúc Hợp đồng.", "relation": "REFERS_TO", "children": []}]}, {"root": {"number": "10.2", "title": "", "is_appendix": false, "matched": true, "score": 0.767, "content": "10.2. Khách hàng cam đoan và bảo đảm rằng:\n\na) Có đầy đủ quyền sử dụng hợp pháp các tài sản, dữ liệu, thông tin cung cấp cho VTIT theo Hợp đồng này;\n\nb) Thông tin, tài liệu, yêu cầu kỹ thuật, nghiệp vụ do Khách hàng cung cấp là chính xác, hợp pháp và không vi phạm quyền của bên thứ ba;\n\nc) Việc ký kết và thực hiện Hợp đồng này không vi phạm bất kỳ nghĩa vụ hợp đồng nào hoặc quy định pháp luật nào mà Khách hàng bị ràng buộc."}, "chain": []}, {"root": {"number": "9.3", "title": "", "is_appendix": false, "matched": true, "score": 0.7652, "content": "9.3. Việc một Bên thuê hoặc giao cho bên thứ ba thực hiện một phần hoặc toàn bộ công việc theo Hợp đồng không được coi là hành vi chuyển nhượng Hợp đồng và không vi phạm nghĩa vụ tại Hợp đồng này, với điều kiện Bên đó vẫn phải chịu trách nhiệm hoàn toàn và trực tiếp trước Bên còn lại về kết quả công việc, chất lượng dịch vụ và các nghĩa vụ khác theo Hợp đồng."}, "chain": []}]}]};
// EMBEDDED_DATA: { contract_id, contract_name, checklist_name, items: [
//   { item_id, category, question, status, evidence, reasoning, recommendation, evidences: [{root, chain}] }
// ]}

const RELATION_LABEL = {
  REFERS_TO: "dẫn chiếu tới", DEPENDS_ON: "phụ thuộc vào", EXCEPTION_TO: "ngoại lệ của",
  REFERS_TO_APPENDIX: "dẫn chiếu tới Phụ lục", DEFINES: "định nghĩa thuật ngữ dùng bởi",
  CONTAINS: "chứa mục con",
};

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderNode(node, relation) {
  const chips = [];
  if (node.is_appendix) chips.push(`<span class="chip appendix">Phụ lục</span>`);
  if (node.matched) chips.push(`<span class="chip matched">Khớp trực tiếp${node.score != null ? " " + node.score.toFixed(4) : ""}</span>`);
  if (relation) chips.push(`<span class="chip relation">${escapeHtml(relation)} (${escapeHtml(RELATION_LABEL[relation] || relation)})</span>`);
  const contentId = "c" + Math.random().toString(36).slice(2);
  const title = node.title ? escapeHtml(node.title) : "";
  return `
    <div class="node">
      <span class="node-number">${escapeHtml(node.number)}</span>
      ${title ? `<span class="node-title">${title}</span>` : ""}
      ${chips.join("")}
      <span class="node-content-toggle" onclick="const el=document.getElementById('${contentId}'); el.classList.toggle('open');">nội dung ▾</span>
    </div>
    <div class="node-content" id="${contentId}">${escapeHtml(node.content || "(không có nội dung)")}</div>
  `;
}

function renderChain(children) {
  if (!children || children.length === 0) return "";
  return `<ul class="tree"><ul>${children.map((child) => `
    <li>
      ${renderNode(child, child.relation)}
      ${renderChain(child.children)}
    </li>
  `).join("")}</ul></ul>`.replace("<ul class=\"tree\"><ul>", "<ul>").replace(/<\/ul><\/ul>$/, "</ul>");
}

function renderEvidenceTree(ev) {
  return `
    <div class="evidence-root">
      ${renderNode(ev.root, null)}
      ${renderChainRoot(ev.chain)}
    </div>
  `;
}

function renderChainRoot(chain) {
  if (!chain || chain.length === 0) return `<div class="empty">(không kéo theo Khoản nào khác qua quan hệ đồ thị)</div>`;
  return `<ul class="tree">${chain.map((child) => `
    <li>
      ${renderNode(child, child.relation)}
      ${renderChain(child.children)}
    </li>
  `).join("")}</ul>`;
}

function renderItem(item) {
  const statusLower = (item.status || "").toLowerCase();
  const isPass = statusLower === "pass" || statusLower === "đạt";
  const evidences = item.evidences || [];
  return `
    <div class="item" data-status="${isPass ? "pass" : "fail"}">
      <div class="item-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="item-id">${escapeHtml(item.item_id)}</span>
        <span class="badge ${isPass ? "pass" : "fail"}">${isPass ? "Đạt" : "Không đạt"}</span>
        <span class="item-q">${escapeHtml(item.question)}</span>
        <span class="chevron">▶</span>
      </div>
      <div class="item-body">
        <div class="field">
          <div class="field-label">Bằng chứng LLM</div>
          <div class="field-text">${escapeHtml(item.evidence || "(trống)")}</div>
        </div>
        <div class="field">
          <div class="field-label">Lý do</div>
          <div class="field-text">${escapeHtml(item.reasoning || "(trống)")}</div>
        </div>
        <div class="field">
          <div class="field-label">Evidence Graph (${evidences.length} root khớp trực tiếp)</div>
          ${evidences.length === 0 ? `<div class="empty">Không có Khoản nào khớp trực tiếp.</div>` : evidences.map(renderEvidenceTree).join("")}
        </div>
      </div>
    </div>
  `;
}

function render(data) {
  const main = document.getElementById("main");
  const summary = document.getElementById("summary");
  const items = data.items || [];
  const nPass = items.filter((it) => (it.status || "").toLowerCase().match(/pass|đạt/)).length;
  summary.textContent = `Hợp đồng: ${data.contract_name || data.contract_id} - Checklist: ${data.checklist_name || ""} - ${items.length} mục (${nPass} đạt / ${items.length - nPass} không đạt)`;
  main.innerHTML = items.map(renderItem).join("");

  document.querySelectorAll(".filters button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filters button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      const filter = btn.dataset.filter;
      document.querySelectorAll(".item").forEach((el) => {
        el.style.display = filter === "all" || el.dataset.status === filter ? "" : "none";
      });
    });
  });
}

render(typeof EMBEDDED_DATA !== "undefined" ? EMBEDDED_DATA : { items: [] });
</script>
